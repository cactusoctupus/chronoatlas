}

/* ---- Session tracker (top-right pill) ----
 * v1.7: adapts to current snapshot. Counts only entries whose status key starts
 * with the current snapshot year; total = number of features at that snapshot. */
function updateQuizTracker(){
  const trk=document.getElementById('quiz-tracker'); if(!trk)return;
  const sk = (typeof findSnap==='function') ? findSnap(currentYear) : 2000;
  const prefix = sk + '__';
  let aced=0, missed=0;
  for(const k in QUIZ.status){
    if(!k.startsWith(prefix)) continue;
    if(QUIZ.status[k]==='correct')aced++;
    else if(QUIZ.status[k]==='wrong')missed++;
  }
  let total;
  if(typeof SNAPSHOTS!=='undefined' && SNAPSHOTS[sk] && SNAPSHOTS[sk][0] && SNAPSHOTS[sk][0].modern){
    total = (typeof MODERN_GEO!=='undefined' && MODERN_GEO.features) ? MODERN_GEO.features.length : 176;
  } else if(typeof SNAPSHOTS!=='undefined' && SNAPSHOTS[sk]){
    // v1.16: stateless peoples are not quizzable; exclude from the denominator
    total = SNAPSHOTS[sk].filter(e => !e.peoples).length;
  } else {
    total = 0;
  }
  const acedEl=trk.querySelector('.qt-aced');
  const totalEl=trk.querySelector('.qt-total');
  const missedEl=trk.querySelector('.qt-missed');
  if(acedEl)acedEl.textContent=aced;
  if(totalEl)totalEl.textContent='/ '+total+' aced';
  if(missedEl){
    missedEl.textContent=missed+(missed===1?' missed':' missed');
    if(missed===0)missedEl.classList.add('empty'); else missedEl.classList.remove('empty');
  }
}

/* ---- Answer normalization & matching ---- */
function quizNorm(s){
  if(!s)return '';
  s=String(s).toLowerCase();
  // strip diacritics
  s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  // remove punctuation, keep letters/numbers/spaces
  s=s.replace(/[^a-z0-9\s]/g,' ');
  // strip common articles/prefixes
  s=' '+s+' ';
  ['the','republic of','democratic republic of','kingdom of','state of','islamic republic of','people s republic of','federation of','federal republic of','united','grand duchy of','principality of','sultanate of','commonwealth of','plurinational state of','islamic state of'].forEach(p=>{s=s.replace(new RegExp('\\s'+p+'\\s','g'),' ')});
  // collapse spaces
  return s.replace(/\s+/g,' ').trim();
}
function quizMatch(input,accepted){
  const n=quizNorm(input);
  if(!n)return false;
  for(const a of accepted){
    const an=quizNorm(a);
    if(!an)continue;
    if(n===an)return true;
    // accept if user said a fragment that contains the answer (e.g. "i think it's accra")
    if(n.split(' ').includes(an))return true;
    // accept if all words of accepted appear in input (handles "united states of america")
    const aw=an.split(' ').filter(Boolean);
    if(aw.length>1 && aw.every(w=>n.includes(w)))return true;
    // accept if input is a single word and that word appears in the accepted answer
    if(!n.includes(' ') && aw.includes(n))return true;
    // v1.11: accept if input is multi-word and ALL its words appear in the accepted answer
    // (so 'Mon-Khmer' matches 'Mon-Khmer dialects')
    const nw=n.split(' ').filter(Boolean);
    if(nw.length>1 && nw.every(w=>aw.includes(w)))return true;
  }
  return false;
}

/* ---- Quiz state lifecycle ---- */
function startQuiz(countryName){
  // Cancel anything in progress
  stopListening();
  const facts=COUNTRY_FACTS[countryName];
  if(!facts){
    openCountryPanel(countryName,currentYear);
    return;
  }
  const prev=QUIZ.active&&QUIZ.active.name;
  // year=findSnap(currentYear) so the status key matches the modern snapshot (2000)
  const yr = (typeof findSnap==='function') ? findSnap(currentYear) : 2000;
  if(typeof GUIDED!=='undefined' && GUIDED.active && GUIDED.queue.indexOf(countryName)===-1) GUIDED.active=false;
  QUIZ.active={name:countryName, year:yr, stepIdx:0, langsLeft:facts.languages.map(l=>l.slice()), langsNamed:[], trail:[], isHistorical:false};
  refreshModernStyle();
  if(typeof isSmallScreen==='function'&&isSmallScreen())zoomToCountry(countryName);
  renderQuiz();
}

/* v1.7: start a quiz for a historical empire. Same chain as modern, but uses
 * HISTORICAL_FACTS for matching/display. Status keyed by year__name so each
 * snapshot's progress is independent. */
function startQuizForEmpire(emp, year){
  stopListening();
  // v1.7.1: normalize year to snapshot key so HISTORICAL_FACTS lookup works regardless of slider position
  const sk = (typeof findSnap==='function') ? findSnap(year) : year;
  const key = sk + '__' + emp.name;
  const hf = (typeof HISTORICAL_FACTS!=='undefined') ? HISTORICAL_FACTS[key] : null;
  if(!hf){
    // No data — fall back to info panel
    openPanel(emp, year);
    return;
  }
  QUIZ.active={
    name: emp.name,
    year: sk,
    stepIdx: 0,
    langsLeft: hf.languages.map(l=>l.slice()),
    langsNamed: [],
    trail: [],
    isHistorical: true,
    empData: emp,
  };
  refreshHistoricalStyle();
  if(typeof isSmallScreen==='function'&&isSmallScreen())zoomToEmpire(emp);
  renderQuiz();
}

/* Restyle the historical empire polygons currently on the map based on QUIZ.status. */
function refreshHistoricalStyle(){
  if(typeof layers==='undefined') return;
  layers.forEach(l=>{
    if(!l._empName) return;
    const name = l._empName;
    const yr = (typeof findSnap==='function') ? findSnap(currentYear) : null;
    const st = QUIZ.status[yr+'__'+name];
    const isActive = QUIZ.active && QUIZ.active.name===name && QUIZ.active.year===yr;
    let fc=l._empColor.f, sc=l._empColor.s, fop=0.5, w=2.5, dash=null;
    if(st==='correct'){fc='#1F5530'; sc='#0E3A1A'; fop=0.78; w=1.8;}
    else if(st==='wrong'){fc='#7A1A1A'; sc='#4A0A0A'; fop=0.78; w=1.8;}
    if(isActive){fop=0.9; sc='#8A4040'; w=3.0; dash='4,3';}
    if(l.setStyle) l.setStyle({fillColor:fc, fillOpacity:fop, color:sc, weight:w, dashArray:dash});
  });
}
function abortQuiz(){
  const wasHist = QUIZ.active && QUIZ.active.isHistorical;
  stopListening();
  QUIZ.active=null;
  if(wasHist) refreshHistoricalStyle(); else refreshModernStyle();
  closePanel();
}
function advanceStep(answerShown){
  const a=QUIZ.active;if(!a)return;
  const step=activeSteps()[a.stepIdx];
  a.trail.push({label:step.label, sub:step.sub, answer:answerShown});
  a.stepIdx++;
  if(a.stepIdx>=activeSteps().length){
    // L1 complete
    QUIZ.status[a.year+'__'+a.name]='correct';
    renderQuizDone();
    if(a.isHistorical) refreshHistoricalStyle(); else refreshModernStyle();
    updateQuizTracker();
    return;
  }
  renderQuiz();
}
function failStep(correctReveal){
  const a=QUIZ.active;if(!a)return;
  const step=activeSteps()[a.stepIdx];
  const k = a.year+'__'+a.name;
  if(QUIZ.status[k]!=='correct')QUIZ.status[k]='wrong';
  if(a.isHistorical) refreshHistoricalStyle(); else refreshModernStyle();
  updateQuizTracker();
  a.failed={label:step.label, reveal:correctReveal};
  renderQuiz();
}
function restartCountry(){
  const a=QUIZ.active;if(!a)return;
  let facts;
  if(a.isHistorical){
    facts = HISTORICAL_FACTS[a.year+'__'+a.name];
    QUIZ.active={name:a.name, year:a.year, stepIdx:0, langsLeft:facts.languages.map(l=>l.slice()), langsNamed:[], trail:[], isHistorical:true, empData:a.empData};
  } else {
    facts = COUNTRY_FACTS[a.name];
    QUIZ.active={name:a.name, year:a.year, stepIdx:0, langsLeft:facts.languages.map(l=>l.slice()), langsNamed:[], trail:[], isHistorical:false};
  }
  renderQuiz();
}

/* ---- Quiz panel rendering ---- */
function renderQuiz(){
  const a=QUIZ.active;if(!a)return;
  const step=activeSteps()[a.stepIdx];
  const total=activeSteps().length;
  const pct=Math.round((a.stepIdx/total)*100);
  document.getElementById('panel-title').textContent=(a.stepIdx===0?'Identify the country':a.name);
  document.getElementById('panel-subtitle').textContent='Quiz · Level '+QUIZ.level;
  // Hide country name in subtitle until identified
  let html='<div class="quiz-pane">';
  html+='<div class="quiz-step-meta"><span>Step '+(a.stepIdx+1)+' of '+total+'</span><span class="level-tag">L'+QUIZ.level+'</span></div>';
  html+='<div class="quiz-progress"><div class="bar" style="width:'+pct+'%"></div></div>';
  if(typeof GUIDED!=='undefined' && GUIDED.active && GUIDED.group!==null && !a.isHistorical){
    const gg=QUIZ_GROUPS[GUIDED.continent].groups[GUIDED.group];
    html+='<div class="guided-crumb"><span>Set: '+escapeHtml(gg.name)+' &middot; '+groupProgress(gg)+' / '+gg.countries.length+' mastered</span><a href="#" onclick="exitGuided();return false;">Exit set</a></div>';
  }
  html+='<div class="quiz-prompt">'+escapeHtml(step.prompt)+'</div>';
  if(step.sub)html+='<div class="quiz-sub">'+escapeHtml(step.sub)+'</div>';

  if(a.failed){
    // Wrong-answer state: show reveal and Try-again button
    html+='<div class="quiz-feedback bad visible"><strong>Not quite — restarting '+escapeHtml(a.name)+'</strong>'+escapeHtml(a.failed.label)+': <em>'+escapeHtml(a.failed.reveal)+'</em></div>';
    html+='<button id="quiz-submit" class="next" onclick="restartCountry()">Try this country again</button>';
    html+='<div class="quiz-sub" style="text-align:center;margin-top:6px">…or click another country on the map.</div>';
  } else {
    // Normal answering state — typed input only (voice removed in v1.6.4 per user request)
    html+='<div class="quiz-input-row">';
    html+='<input id="quiz-answer" type="text" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false">';
    html+='</div>';
    html+='<button id="quiz-submit" onclick="submitQuiz()">Submit</button>';
  }
  // Trail of previous correct answers
  if(a.trail.length){
    html+='<div class="quiz-trail"><h4>Progress</h4><ul>';
    a.trail.forEach(t=>{
      html+='<li><span class="check">✓</span><span><span class="lbl">'+escapeHtml(t.label)+(t.sub?' '+escapeHtml(t.sub):'')+'</span>'+escapeHtml(t.answer)+'</span></li>';
    });
    html+='</ul></div>';
  }
  html+='</div>';
  document.getElementById('panel-body').innerHTML=html;
  document.getElementById('side-panel').classList.add('open');
  // Focus the input
  const inp=document.getElementById('quiz-answer');
  if(inp){
    if(!(typeof isSmallScreen==='function'&&isSmallScreen()))inp.focus();
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){submitQuiz()}});
  }
}
function getActiveFacts(a){
  if(!a)return null;
  if(a.isHistorical){
    return (typeof HISTORICAL_FACTS!=='undefined') ? HISTORICAL_FACTS[a.year+'__'+a.name] : null;
  }
  return (typeof COUNTRY_FACTS!=='undefined') ? COUNTRY_FACTS[a.name] : null;
}
function renderQuizDone(){
  const a=QUIZ.active;if(!a)return;
  const facts=getActiveFacts(a) || COUNTRY_FACTS[a.name];
  let html='<div class="quiz-pane">';
  const inGuided=(typeof GUIDED!=='undefined')&&GUIDED.active&&!a.isHistorical;
  html+='<div class="quiz-done"><h2>🎉 Level '+QUIZ.level+' complete</h2><p><strong>'+escapeHtml(a.name)+'</strong> mastered.</p>'+(inGuided?'':'<p class="pickanother">Pick another country on the map to keep going. Future levels will dive deeper.</p>')+'</div>';
  if(inGuided){
    html+='<button class="guided-next" onclick="guidedNext()">Next country &rarr;</button>';
    html+='<button class="guided-back" onclick="exitGuided()">Back to sets</button>';
  }
  html+='<div class="quiz-trail"><h4>What you got</h4><ul>';
  a.trail.forEach(t=>{
    html+='<li><span class="check">✓</span><span><span class="lbl">'+escapeHtml(t.label)+(t.sub?' '+escapeHtml(t.sub):'')+'</span>'+escapeHtml(t.answer)+'</span></li>';
  });
  html+='</ul></div>';
  // Show full reference with percentages
  html+='<div class="panel-section"><h3>Reference</h3>';
  html+='<p style="font-size:12px;color:var(--text2);line-height:1.7"><strong>Capital:</strong> '+escapeHtml(facts.capital[0])+'<br>';
  html+='<strong>Currency:</strong> '+escapeHtml(facts.currency[0])+'<br>';
  if(facts.religion_top3){
    html+='<strong>Top 3 religions:</strong> '+facts.religion_top3.map(r=>escapeHtml(r.name)+' '+r.pct+'%').join(' · ')+'<br>';
  }
  if(facts.language_pct){
    html+='<strong>Top 3 languages:</strong> '+facts.languages.map((l,i)=>escapeHtml(l[0])+' '+facts.language_pct[i]+'%').join(' · ');
  } else {
    html+='<strong>Top 3 languages:</strong> '+facts.languages.map(l=>escapeHtml(l[0])).join(', ');
  }
  html+='</p></div>';
  html+='<div class="panel-section"><h3>Learn more</h3><div class="panel-links"><a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(a.name.replace(/ /g,'_'))+'" target="_blank">Wikipedia article →</a></div></div>';
  html+='</div>';
  document.getElementById('panel-title').textContent=a.name;
  document.getElementById('panel-subtitle').textContent='Quiz · Level '+QUIZ.level+' complete';
  document.getElementById('panel-body').innerHTML=html;
  document.getElementById('side-panel').classList.add('open');
  QUIZ.active=null;  // clear active so map clicks can start a new one
}

/* ---- Display helpers (decorate revealed answers with percentages) ---- */
function langDisplay(facts, primary){
  if(!facts || !facts.language_pct)return primary;
  const i=facts.languages.findIndex(L=>L[0]===primary);
  return (i>=0 && facts.language_pct[i]!=null) ? (primary+' ('+facts.language_pct[i]+'%)') : primary;
}
function religionDisplay(facts){
  // Prefer the percentage-decorated top religion if available, else fall back to the
  // canonical first accept-list entry. Used for the wrong-answer reveal.
  if(facts && facts.religion_top3 && facts.religion_top3[0]){
    return facts.religion_top3[0].name+' ('+facts.religion_top3[0].pct+'%)';
  }
  return (facts && facts.religion && facts.religion[0]) || '';
}
function religionMatchedDisplay(facts, userInput){
  // For pluralistic countries, show the religion the user actually matched (with its %),
  // not the dominant one. Falls back to the dominant religion if no top3 entry maps cleanly.
  if(!facts || !facts.religion_top3)return facts && facts.religion && facts.religion[0] || userInput;
  for(const r of facts.religion_top3){
    if(quizMatch(userInput, [r.name]))return r.name+' ('+r.pct+'%)';
  }
  return religionDisplay(facts);
}

/* ---- Submit / answer dispatch ---- */
function submitQuiz(){
  const a=QUIZ.active;if(!a)return;
  const inp=document.getElementById('quiz-answer');
  if(!inp)return;
  const raw=inp.value;
  if(!raw.trim())return;
  stopListening();
  const facts=getActiveFacts(a);
  if(!facts)return;
  const step=activeSteps()[a.stepIdx];
  let accepted, reveal;
  if(step.key==='name'){accepted=facts.alias; reveal=a.name;}
  else if(step.key==='lang'){
    // Match against any remaining top-3 language entry
    let hitIdx=-1;
    for(let i=0;i<a.langsLeft.length;i++){
      if(quizMatch(raw,a.langsLeft[i])){hitIdx=i;break;}
    }
    if(hitIdx>=0){
      const matched=a.langsLeft[hitIdx][0];
      a.langsNamed.push(matched);
      a.langsLeft.splice(hitIdx,1);
      advanceStep(langDisplay(facts,matched));
      return;
    }
    // Wrong language — reveal the next remaining one (with %)
    failStep(langDisplay(facts, a.langsLeft[0][0]));
    return;
  }
  else if(step.key==='religion'){
    accepted=facts.religion; reveal=religionDisplay(facts);
  }
  else {accepted=facts[step.key]; reveal=accepted[0];}
  if(quizMatch(raw,accepted)){
    if(step.key==='religion')advanceStep(religionMatchedDisplay(facts,raw));
    else advanceStep(accepted[0]);
  } else {
    failStep(reveal);
  }
}

/* Maximally aggressive label scrubber. Walks every country path and (a) removes
 * any `title`, `aria-label`, `aria-labelledby`, `data-name`, `data-tooltip`,
 * `tabindex`, `role` attributes and (b) deletes any SVG `<title>` and `<desc>`
 * children. Sets `aria-hidden=true` to suppress accessibility-driven hover labels.
 * Exposed on window so the user can also call it manually from DevTools if a
 * label still appears: window.scrubCountryLabels() */
function scrubCountryLabels(){
  if(!QUIZ.geoLayer)return;
  const ATTRS=['title','aria-label','aria-labelledby','aria-describedby','data-name','data-tooltip','data-title','tabindex','role'];
  QUIZ.geoLayer.eachLayer(l=>{
    const e=l.getElement&&l.getElement(); if(!e)return;
    ATTRS.forEach(a=>e.removeAttribute(a));
    e.setAttribute('aria-hidden','true');
    if(e.querySelectorAll){e.querySelectorAll('title,desc').forEach(t=>{try{t.remove();}catch(err){}});}
    // Same scrub on any descendant node Leaflet/browser might have added
    if(e.querySelectorAll){e.querySelectorAll('*').forEach(n=>{ATTRS.forEach(a=>n.removeAttribute(a));});}
  });
}
if(typeof window!=='undefined')window.scrubCountryLabels=scrubCountryLabels;
function refreshModernStyle(){
  if(!QUIZ.geoLayer)return;
  scrubCountryLabels();   // re-strip on every restyle in case Leaflet re-attached anything
  QUIZ.geoLayer.eachLayer(l=>{
    const f=l.feature; if(!f)return;
    const name=f.properties.name||'';
    const p=MODERN_PALETTE[modernHash(name)%MODERN_PALETTE.length];
    const status=QUIZ.status['2000__'+name];   // 'correct' | 'wrong' | undefined (year-keyed)
    const isActive=QUIZ.active && QUIZ.active.name===name;
    let fc=p.f, sc=p.s, fop=0.45, w=0.7, dash=null;
    if(status==='correct'){fc=QUIZ_COLORS.correct.f; sc=QUIZ_COLORS.correct.s; fop=0.78; w=1.6;}
    else if(status==='wrong'){fc=QUIZ_COLORS.wrong.f; sc=QUIZ_COLORS.wrong.s; fop=0.78; w=1.6;}
    if(isActive){fop=0.9; w=2.8; sc='#8A4040'; dash='4,3';}
    l.setStyle({fillColor:fc, fillOpacity:fop, color:sc, weight:w, dashArray:dash});
  });
}

function openDisputedPanel(name,note){
  document.getElementById('panel-title').textContent=name;
  document.getElementById('panel-subtitle').textContent='Disputed territory';
  let h='<div class="panel-section"><h3>Status</h3><p>'+escapeHtml(note||'Contested territory.')+'</p></div>';
  h+='<div class="panel-section"><h3>About this shading</h3><p>Red-hatched areas mark territories whose control or sovereignty is contested. Boundaries shown do not imply endorsement of any claim.</p></div>';
  h+='<div class="panel-section"><h3>Source</h3><p>Natural Earth 1:50m "breakaway and disputed areas" dataset (public domain).</p></div>';
  h+='<div class="panel-section"><h3>Learn more</h3><div class="panel-links"><a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(name.replace(/ /g,'_'))+'" target="_blank">Wikipedia article &rarr;</a></div></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}

:"Sahel & Senegambia","blurb":"The semi-arid belt south of the Sahara — lands of the Mali and Songhai empires.","countries":["Senegal","Gambia","Mali","Burkina Faso","Niger","Chad"]}, {"name":"Atlantic West Africa","blurb":"The upper Atlantic coast — Creole ports, highlands and the Cape Verde islands.","countries":["Cabo Verde","Guinea-Bissau","Guinea","Sierra Leone","Liberia"]}, {"name":"Gulf of Guinea","blurb":"The lower West African coast — Ashanti, Yoruba and Benin heritage, and Africa's most populous state.","countries":["Côte d'Ivoire","Ghana","Togo","Benin","Nigeria"]}, {"name":"Central Africa & the Congo Basin","blurb":"The equatorial forest belt, from Cameroon's highlands through the two Congos.","countries":["Cameroon","Central African Rep.","Eq. Guinea","Gabon","São Tomé and Principe","Congo","Dem. Rep. Congo"]}, {"name":"The Great Lakes & Swahili Coast","blurb":"East Africa's highlands and Indian Ocean shore — Swahili trade culture and the Rift Valley.","countries":["Kenya","Uganda","Rwanda","Burundi","Tanzania"]}, {"name":"South-Central Africa","blurb":"From Angola's coast to the Zambezi — the Bantu south and the old Zimbabwe trading kingdoms.","countries":["Angola","Zambia","Malawi","Mozambique","Zimbabwe","Botswana","Namibia"]}, {"name":"Southern Africa & Indian Ocean Islands","blurb":"South Africa, its enclave kingdoms, and the island nations of the western Indian Ocean.","countries":["South Africa","Lesotho","eSwatini","Madagascar","Comoros","Mauritius","Seychelles"]}]},{"continent":"North America","groups":[ {"name":"Northern America","blurb":"The three giants of the continent, from the Arctic to the tropics.","countries":["Canada","United States of America","Mexico"]}, {"name":"Central America","blurb":"The isthmus linking two continents — Maya heritage and seven small republics.","countries":["Guatemala","Belize","Honduras","El Salvador","Nicaragua","Costa Rica","Panama"]}, {"name":"The Greater Antilles","blurb":"The big Caribbean islands — Spanish, French and British colonial legacies.","countries":["Cuba","Jamaica","Haiti","Dominican Rep.","Bahamas","Puerto Rico"]}, {"name":"The Lesser Antilles","blurb":"The island arc of the eastern Caribbean — small states, shared East Caribbean currency.","countries":["Trinidad and Tobago","Barbados","Grenada","St. Vin. and Gren.","Saint Lucia","Dominica","St. Kitts and Nevis","Antigua and Barb."]}]},{"continent":"South America","groups":[ {"name":"Andean South America","blurb":"The Inca corridor and the Caribbean coast — Bolívar's republics along the cordillera.","countries":["Colombia","Venezuela","Ecuador","Peru","Bolivia"]}, {"name":"Brazil & the Guianas","blurb":"Portuguese America and the three Guianese neighbors on the Atlantic shoulder.","countries":["Brazil","Guyana","Suriname"]}, {"name":"The Southern Cone","blurb":"The temperate south — gaucho country, plus the disputed Falklands.","countries":["Chile","Argentina","Uruguay","Paraguay","Falkland Is."]}]},{"continent":"Oceania","groups":[ {"name":"Australia & New Zealand","blurb":"The Anglo-Pacific settler nations — and the oldest continuous cultures on Earth.","countries":["Australia","New Zealand"]}, {"name":"Melanesia","blurb":"The 'black islands' arc from New Guinea to Fiji — the Pacific's most populous island region.","countries":["Papua New Guinea","Solomon Is.","Vanuatu","Fiji","New Caledonia"]}, {"name":"Micronesia","blurb":"The 'small islands' of the northwest Pacific — atoll nations in free association with the US, plus Nauru and Kiribati.","countries":["Palau","Micronesia","Marshall Is.","Nauru","Kiribati"]}, {"name":"Polynesia","blurb":"The 'many islands' of the central Pacific — the great voyaging triangle's independent states.","countries":["Samoa","Tonga","Tuvalu"]}]}];
const GUIDED={continent:null, group:null, queue:[], pos:-1, active:false};
function isModernSnapNow(){const sk=findSnap(currentYear);const d=SNAPSHOTS[sk];return !!(d&&d[0]&&d[0].modern);}
function groupProgress(g){let a=0;for(const n of g.countries){if(QUIZ.status['2000__'+n]==='correct')a++;}return a;}
function continentProgress(c){let a=0,t=0;for(const g of c.groups){a+=groupProgress(g);t+=g.countries.length;}return [a,t];}
function renderGuidedHome(){
  if(!isModernSnapNow())setYear(2026);
  GUIDED.continent=null;GUIDED.group=null;GUIDED.active=false;
  document.getElementById('panel-title').textContent='Guided practice';
  document.getElementById('panel-subtitle').textContent='Quiz · pick a continent';
  let h='<div class="quiz-pane"><div class="quiz-prompt">Which continent do you want to master?</div><div class="guided-list">';
  QUIZ_GROUPS.forEach((c,i)=>{
    const p=continentProgress(c);
    h+='<button class="guided-item'+(p[0]===p[1]?' done':'')+'" onclick="renderGuidedContinent('+i+')"><span class="gi-name">'+escapeHtml(c.continent)+'</span><span class="gi-prog">'+p[0]+' / '+p[1]+(p[0]===p[1]?' &#10003;':'')+'</span></button>';
  });
  h+='</div><div class="quiz-sub" style="margin-top:10px">Each continent is broken into small sets grouped by cultural and historical ties — master one set at a time. Or click any country on the map to free-play.</div></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}
function renderGuidedContinent(ci){
  const c=QUIZ_GROUPS[ci];if(!c)return;
  GUIDED.continent=ci;GUIDED.group=null;GUIDED.active=false;
  document.getElementById('panel-title').textContent=c.continent;
  document.getElementById('panel-subtitle').textContent='Quiz · pick a set';
  let h='<div class="quiz-pane"><div class="guided-headrow"><a href="#" onclick="renderGuidedHome();return false;">&larr; Continents</a></div><div class="guided-list">';
  c.groups.forEach((g,gi)=>{
    const a=groupProgress(g),t=g.countries.length;
    h+='<button class="guided-item'+(a===t?' done':'')+'" onclick="startGroup('+ci+','+gi+')"><span class="gi-name">'+escapeHtml(g.name)+'<div class="guided-blurb">'+escapeHtml(g.blurb)+'</div></span><span class="gi-prog">'+a+' / '+t+(a===t?' &#10003;':'')+'</span></button>';
  });
  h+='</div></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}
function startGroup(ci,gi){
  GUIDED.continent=ci;GUIDED.group=gi;GUIDED.active=true;
  GUIDED.queue=QUIZ_GROUPS[ci].groups[gi].countries.slice();
  GUIDED.pos=-1;
  guidedNext();
}
function guidedNext(){
  if(!GUIDED.active||GUIDED.group===null)return;
  let next=null;
  for(let i=1;i<=GUIDED.queue.length;i++){
    const idx=(GUIDED.pos+i)%GUIDED.queue.length;
    if(QUIZ.status['2000__'+GUIDED.queue[idx]]!=='correct'){next=idx;break;}
  }
  if(next===null){renderGroupComplete();return;}
  GUIDED.pos=next;
  const name=GUIDED.queue[next];
  zoomToCountry(name);
  startQuiz(name);
}
function quizFitOpts(){
  // v1.23: on phones, reserve the bottom of the viewport (question sheet) so the
  // target country lands in the visible upper area of the map.
  if(typeof isSmallScreen==='function' && isSmallScreen()){
    const vh=(typeof window!=='undefined'&&window.innerHeight)?window.innerHeight:800;
    return {paddingTopLeft:[36,96], paddingBottomRight:[36, Math.round(vh*0.42)+36], maxZoom:5};
  }
  return {padding:[60,60], maxZoom:5};
}
function zoomToCountry(name){
  if(!QUIZ.geoLayer||!map)return;
  let target=null;
  QUIZ.geoLayer.eachLayer(l=>{const f=l.feature;if(f&&f.properties&&f.properties.name===name&&!f.properties._wrapDx)target=l;});
  if(target&&target.getBounds){try{map.fitBounds(target.getBounds(),quizFitOpts());}catch(e){}}
}
function zoomToEmpire(emp){
  if(typeof layers==='undefined'||!map)return;
  let target=null;
  layers.forEach(l=>{if(l._empName===emp.name && l._wrapDx===0)target=l;});
  if(target&&target.getBounds){try{map.fitBounds(target.getBounds(),quizFitOpts());}catch(e){}}
}
function renderGroupComplete(){
  const g=QUIZ_GROUPS[GUIDED.continent].groups[GUIDED.group];
  GUIDED.active=false;
  document.getElementById('panel-title').textContent=g.name;
  document.getElementById('panel-subtitle').textContent='Set mastered';
  let h='<div class="quiz-pane"><div class="quiz-done"><h2>&#127891; Set mastered</h2><p><strong>'+escapeHtml(g.name)+'</strong> — all '+g.countries.length+' countries aced.</p></div>';
  h+='<button class="guided-next" onclick="renderGuidedContinent('+GUIDED.continent+')">Pick another set</button>';
  h+='<button class="guided-back" onclick="renderGuidedHome()">All continents</button></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}
function exitGuided(){
  GUIDED.active=false;
  if(GUIDED.continent!==null)renderGuidedContinent(GUIDED.continent);else renderGuidedHome();
}

/* ---- Tiny helper ---- */
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

window.addEventListener('DOMContentLoaded',initMap);
</script>
