and the famous chess set sent as a diplomatic gift to India.","links":["https://en.wikipedia.org/wiki/Sasanian_Empire"]}},{"name":"Gupta Empire (late)","c":{"f":"#70B870","s":"#308A30"},"coords":[[31,73],[30,77],[28.5,80.5],[27,84],[25,87.5],[22.5,88],[20,86],[18,83],[16.5,80],[16,76.5],[17.5,74],[20,73],[23,72.5],[26,72.5],[28.5,72.5]],"info":{"capital":"Pataliputra","pop":"~32 million","synopsis":"The Gupta Empire is in its late phase under Buddhagupta. The \"Indian Golden Age\" has produced Aryabhata's decimal place-value system and concept of zero (born 476 CE), Kalidasa's Sanskrit poetry and drama, the Kama Sutra, the great epics in their final form, and the Hindu temple architecture that defines later Indian religious building. The Hephthalite (White Hun) invasions are now degrading the empire; by 550 CE Gupta power will collapse. (Source: Snow 2018 references)","links":["https://en.wikipedia.org/wiki/Gupta_Empire","https://en.wikipedia.org/wiki/Aryabhata"]}},{"name":"Frankish Kingdoms (Clovis)","c":{"f":"#88B898","s":"#3A7A4A"},"coords":[[51.5,-1.5],[51,2],[50,4.5],[49.5,7],[48,7.5],[47,7],[46,6],[45,5],[44,3.5],[43.5,1],[43.5,-1.5],[45,-2],[47,-3],[49,-3],[50.5,-2]],"info":{"capital":"Paris (Clovis chose it as capital c.508 CE)","pop":"~5 million","synopsis":"Clovis I (r.481-511 CE), king of the Salian Franks, has united the Frankish tribes, defeated the Roman general Syagrius (486 CE), the Alamanni (496 CE), and the Visigoths at Vouillé (507 CE). His conversion to Catholic (not Arian) Christianity allies him with the Gallo-Roman bishops and aristocracy. The Merovingian dynasty he founds will rule for 250 years; medieval France is being born.","links":["https://en.wikipedia.org/wiki/Clovis_I","https://en.wikipedia.org/wiki/Merovingian_dynasty"]}},{"name":"Visigothic Kingdom","c":{"f":"#A8B870","s":"#586830"},"coords":[[44,-9.5],[43.5,-1.5],[43,2],[44,5],[44.5,3.5],[44,2],[43.5,0],[43,-3],[42,-7],[40,-9],[37.5,-9],[36,-6],[37,-2],[38.5,1],[40.5,0.5],[42,-2]],"info":{"capital":"Toulouse (until 507), then Toledo","pop":"~6 million","synopsis":"The Visigoths, having sacked Rome under Alaric (410 CE) and migrated through Gaul, now hold most of Iberia and a strip of southern Gaul. Defeated by Clovis at Vouillé (507 CE), they have just lost most of Gaul and are consolidating their kingdom in Spain with Toledo as the new capital. They are Arian Christians; conversion to Catholicism (under King Reccared in 589 CE) will integrate them with the Hispano-Roman population.","links":["https://en.wikipedia.org/wiki/Visigothic_Kingdom"]}},{"name":"Ostrogothic Kingdom","c":{"f":"#A89878","s":"#605030"},"coords":[[46.5,8],[46.5,12],[46,15.5],[45.5,18],[44,18.5],[42,18.5],[40,18.5],[38,16],[37,14.5],[37,12.5],[38.5,10],[41,9],[43,8.5],[44.5,7.5],[45.5,7.5]],"info":{"capital":"Ravenna","pop":"~6 million","synopsis":"Theodoric the Great (r.493-526 CE) rules Italy from Ravenna as a nominal viceroy of the Eastern Emperor but de facto independent king. He preserves much of Roman administration, employs Cassiodorus and Boethius (executed 524 CE) as advisors, and presides over a brief Late Antique cultural flowering in Italy. After his death, Justinian's reconquest (Gothic War 535-554 CE) will devastate Italy and end Ostrogothic rule. (Source: Snow 2018, pp.92-93)","links":["https://en.wikipedia.org/wiki/Ostrogothic_Kingdom","https://en.wikipedia.org/wiki/Theodoric_the_Great"]}},{"name":"Vandal Kingdom","c":{"f":"#90A8A0","s":"#506860"},"coords":[[37.5,8],[37,11.5],[36,12],[34.5,11],[33,10],[32,8],[31.5,5],[33,2.5],[34.5,1.5],[36,3.5],[37,5.5]],"info":{"capital":"Carthage","pop":"~3 million","synopsis":"The Vandals, having migrated through Iberia and crossed to North Africa under Genseric (429 CE), captured Carthage (439 CE), and famously sacked Rome (455 CE). They control the former Roman provinces of Africa Proconsularis and beyond. They are Arian Christians and persecute Catholics. Justinian's general Belisarius will conquer the kingdom in 534 CE, returning North Africa briefly to Roman rule. (Source: Snow 2018, pp.92-93)","links":["https://en.wikipedia.org/wiki/Vandal_Kingdom"]}},{"name":"Hephthalite Empire (White Huns)","c":{"f":"#B89878","s":"#706040"},"coords":[[45,55],[44.5,60],[43.5,65],[42,70],[40,72.5],[37,73],[34,72],[33,68],[34.5,64],[36.5,61],[39.5,58.5],[42,56]],"info":{"capital":"Balkh / Gorgo","pop":"~unknown","synopsis":"The Hephthalites, also called the White Huns, are a confederation of pastoral peoples that has destroyed the Kidarite kingdom and is now pressuring Sassanid Persia from the east and the Gupta Empire from the northwest. Toramana and his son Mihirakula (the latter a notorious persecutor of Buddhists) lead Hephthalite invasions of India that fatally weaken the Guptas. Around 560 CE the Hephthalites will be crushed by an alliance of Sassanid Persia and the rising Göktürks.","links":["https://en.wikipedia.org/wiki/Hephthalites"]}},{"name":"Northern Wei Dynasty","c":{"f":"#9CA8C0","s":"#5C6888"},"coords":[[44,98],[43,105],[42,112],[41,118],[39,121],[37,121.5],[35,120],[33,118],[32,115],[31.5,110],[32.5,105],[34,101],[37,98.5],[40,97.5],[42.5,97.5]],"info":{"capital":"Luoyang (moved from Pingcheng in 494 CE)","pop":"~30 million","synopsis":"The Tuoba Xianbei have unified north China as the Northern Wei (386-534 CE). Emperor Xiaowen (r.471-499 CE) has just moved the capital from Pingcheng (Datong) to Luoyang and decreed sweeping sinicization: Chinese surnames, dress, and language. The Yungang and Longmen cave-temple complexes, with their thousands of Buddhist sculptures, are being carved. After 534 CE the dynasty will fragment into the Eastern and Western Wei. (Source: Snow 2018, pp.82-83 context)","links":["https://en.wikipedia.org/wiki/Northern_Wei","https://en.wikipedia.org/wiki/Northern_and_Southern_dynasties"]}},{"name":"Liu Song / Southern Qi Dynasty","c":{"f":"#88B898","s":"#487048"},"coords":[[33.5,103],[33,108],[32.5,114],[31.5,119.5],[30,121.5],[27,120.5],[24.5,118.5],[22.5,115.5],[21.5,111],[21.5,107],[22.5,103.5],[25,101],[28.5,100.5],[31.5,101.5]],"info":{"capital":"Jiankang (modern Nanjing)","pop":"~25 million","synopsis":"The southern half of China continues under a series of Han Chinese dynasties (Liu Song 420-479, Southern Qi 479-502, Liang 502-557, Chen 557-589). Émigré scholars from the lost north have transformed Jiankang into the cultural capital of Chinese civilization. Buddhism is flourishing, Daoism is being formalized, and the Six Dynasties period produces some of the great Chinese poetry and painting. (Source: Snow 2018, pp.82-83 context)","links":["https://en.wikipedia.org/wiki/Northern_and_Southern_dynasties","https://en.wikipedia.org/wiki/Liu_Song_dynasty"]}},{"name":"Aksum","c":{"f":"#9C7050","s":"#5A4028"},"coords":[[18.5,37],[18,40.5],[16.5,43],[14,43.5],[12,43.5],[10,42],[10.5,39.5],[12.5,37.5],[15,36],[17,36.5]],"info":{"capital":"Aksum","pop":"~5 million","synopsis":"Aksum is at its political and territorial peak. King Kaleb has just intervened across the Red Sea to depose the Jewish Himyarite king Dhu Nuwas in Yemen (c.520 CE), bringing southern Arabia briefly under Aksumite influence. Aksum's gold coinage is one of only four currencies (alongside Roman, Persian, and Kushan) recognized across the trading world per the 3rd-century Persian prophet Mani.","links":["https://en.wikipedia.org/wiki/Kingdom_of_Aksum"]}},{"name":"Maya (Early Classic, late phase)","c":{"f":"#A0B870","s":"#608030"},"coords":[[21.5,-91],[21.5,-87.5],[20,-86.8],[18,-87.5],[16,-88.5],[14.5,-89.5],[13.5,-90.5],[14.5,-92],[16.5,-92],[18,-91.5],[19.5,-91]],"info":{"capital":"Tikal, Calakmul, Caracol, Palenque","pop":"~6-10 million","synopsis":"Maya city-states across the Yucatán, Petén, and southern lowlands continue the Classic florescence. Tikal and Calakmul are the great rival superpowers; their century-long contest will define Maya geopolitics until the Late Classic period. Teotihuacán's influence persists in royal iconography. The Long Count, glyphic writing, monumental art, and astronomical observation are at their height. (Source: Snow 2018, pp.78-79)","links":["https://en.wikipedia.org/wiki/Maya_civilization"]}},{"name":"Yamato Japan (Kofun period)","c":{"f":"#D8B098","s":"#7A5C42"},"coords":[[34,131],[34.5,133],[35.5,135],[36.5,136.5],[37,138],[36.5,140],[35.5,140.5],[34.5,140],[33.5,135.5],[33,132.5]],"info":{"capital":"Yamato (region around modern Nara)","pop":"~5 million","synopsis":"Japan is in the Kofun period (c.300-538 CE). Massive keyhole-shaped tomb mounds, the largest exceeding 400 meters in length (the tomb of Emperor Nintoku at Daisen Kofun), are being constructed for the Yamato kings. Continental influences (Buddhism, writing, advanced metallurgy, the horse) will arrive in force in 538 CE with the formal introduction of Buddhism from the Korean kingdom of Baekje.","links":["https://en.wikipedia.org/wiki/Kofun_period","https://en.wikipedia.org/wiki/Yamato_period"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Eurasian steppe nomads (pre-Mongol)","c":{"f":"#A8A8A8","s":"#404040"},"coords":[[52,30],[55,80],[52,115],[44,110],[40,80],[44,42],[48,32],[52,30]],"peoples":true,"info":{"region":"Eurasian steppe — Pannonia to Mongolia","lifeway":"Pastoral nomads (horses, sheep); mounted archers","languages":"Various Turkic, Mongolic, Indo-Iranian (Scythian, Sarmatian, Sogdian) languages","synopsis":"The Eurasian steppe was home to a succession of nomadic confederations — Scythians, Xiongnu, Huns, Avars, Göktürks, Uyghurs, Khazars, and many more — none of which fit the conventional definition of states but all of which projected periodic devastating power against sedentary empires from Han China to Rome to Sassanid Persia. The Mongols of 1206 were the culmination of this two-millennia tradition.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}},{"name":"Andean / pre-state highland peoples","c":{"f":"#B89070","s":"#604018"},"coords":[[10,-78],[5,-74],[-10,-75],[-22,-65],[-22,-72],[-13,-78],[-3,-80],[5,-78],[10,-78]],"peoples":true,"info":{"region":"Andean cordillera and Pacific coast — modern Peru, Bolivia, Ecuador","lifeway":"Vertical-ecology farmers (potato, maize, quinoa); llama/alpaca pastoralists","languages":"Proto-Quechua; Aymara; Mochica; many others","synopsis":"Long before the Inca synthesis, the Andes were home to many highland and coastal polities and peoples — Chavín, Paracas, Wari, Tiwanaku, Moche, Nazca, and countless smaller groups. Most were not states in any centralized sense but managed sophisticated vertical-ecology systems (controlling agricultural zones from coast to highlands).","links":[]}}],"800":[{"name":"Carolingian Empire","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[55,-2],[55,8],[52,12],[48,14],[45,16],[42,15],[42,7],[44,3],[44,-2],[48,-4],[51,-4]],"info":{"capital":"Aachen","pop":"10-15 million","synopsis":"On Christmas Day 800 CE, Pope Leo III crowned Charlemagne emperor of the Romans in Rome, the first imperial coronation in the West since the fall of the Western Roman Empire in 476. The Carolingian renaissance revived Latin learning across western Europe and built the administrative model that later European monarchies inherited (Source: Snow 2018, pp.96-99).","links":["https://en.wikipedia.org/wiki/Carolingian_Empire"]}},{"name":"Abbasid Caliphate","c":{"f":"#8AB0A0","s":"#4A7A6A"},"coords":[[40,38],[40,55],[36,62],[30,68],[24,70],[18,65],[14,55],[12,46],[15,40],[20,35],[28,32],[34,32],[37,33],[39,36]],"info":{"capital":"Baghdad (founded 762 CE)","pop":"30-40 million","synopsis":"Under Caliph Harun al-Rashid (786-809), Baghdad became the largest city in the world outside Tang China and the intellectual capital of the Islamic Golden Age. The House of Wisdom translated Greek, Persian and Indian texts into Arabic; Arab mathematicians introduced what Europe would later call Arabic numerals (Source: Snow 2018, pp.100-103).","links":["https://en.wikipedia.org/wiki/Abbasid_Caliphate"]}},{"name":"Tang Dynasty","c":{"f":"#D4B870","s":"#947830"},"coords":[[42,80],[44,90],[46,108],[44,120],[40,123],[34,121],[28,118],[24,115],[22,108],[24,100],[28,95],[33,88],[38,82]],"info":{"capital":"Chang'an (modern Xi'an)","pop":"50-60 million","synopsis":"Tang China at this date was emerging from the An Lushan Rebellion (755-763) that had killed perhaps tens of millions and weakened central authority, but Chang'an still attracted Persian, Sogdian, Arab and Japanese visitors as the world's most cosmopolitan city. The Silk Road and maritime routes through Guangzhou linked Tang to the Abbasids (Source: Snow 2018, pp.104-107).","links":["https://en.wikipedia.org/wiki/Tang_dynasty"]}},{"name":"Byzantine Empire (Iconoclast era)","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[42,18],[42,28],[40,35],[37,36],[35,32],[34,28],[36,24],[39,22],[41,20]],"info":{"capital":"Constantinople","pop":"7-10 million","synopsis":"Under Empress Irene (797-802), Byzantium was the first empire to be ruled in its own right by a woman wearing the imperial title. The Iconoclast controversy over religious images had divided the empire for decades; Irene's councils began restoring icons. Her rule provoked Charlemagne's coronation in 800 — the West refused to accept a woman as Roman emperor (Source: Snow 2018, pp.92-93, 96-99).","links":["https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Isaurian_dynasty"]}},{"name":"Ghana Empire","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[18,-12],[18,-2],[15,5],[12,8],[10,2],[10,-8],[13,-14],[16,-14]],"info":{"capital":"Koumbi Saleh","pop":"1-2 million","synopsis":"The Ghana Empire (Wagadu in its own language) dominated the western Sahel, controlling the gold-for-salt trade between the West African forests and the Berber caravans crossing the Sahara to North Africa. Arab geographers called it 'the land of gold.' Its peak came later under the Soninke kings of the 10th-11th centuries (Source: Snow 2018, pp.108-109).","links":["https://en.wikipedia.org/wiki/Ghana_Empire"]}},{"name":"Tibetan Empire","c":{"f":"#D8B098","s":"#7A5C42"},"coords":[[35,80],[35,98],[33,102],[30,103],[28,100],[28,90],[30,82]],"info":{"capital":"Lhasa","pop":"3-5 million","synopsis":"The Tibetan Empire under Tri Songdetsen and his successors reached its territorial peak in the late 8th century, briefly occupying the Tang capital Chang'an in 763 CE and ruling stretches of the Silk Road. Buddhism was being established as the state religion through the founding of Samye Monastery (Source: Snow 2018, pp.104-105).","links":["https://en.wikipedia.org/wiki/Tibetan_Empire"]}},{"name":"Khmer (pre-Angkor)","c":{"f":"#A8B870","s":"#608030"},"coords":[[14,102],[14,108],[11,108],[10,106],[10,103],[12,101]],"info":{"capital":"Hariharalaya / Indrapura","pop":"1-2 million","synopsis":"Jayavarman II declared independence from Javanese suzerainty around 802 CE and founded what historians call the Khmer Empire, performing the devaraja (god-king) ritual that established the divine kingship of Angkor. The great temple-cities of Angkor would come over the next three centuries (Source: Snow 2018, pp.110-111).","links":["https://en.wikipedia.org/wiki/Khmer_Empire"]}},{"name":"Mississippian (rising)","c":{"f":"#B89070","s":"#705038"},"coords":[[40,-95],[40,-85],[36,-83],[33,-85],[31,-90],[33,-94],[37,-95]],"info":{"capital":"Cahokia (rising c.900)","pop":"0.2-0.5 million","synopsis":"Across the central Mississippi valley, agricultural societies were beginning to organize around large earthen-mound centers. Cahokia, near modern St. Louis, would become the largest pre-Columbian city north of Mexico (Source: Snow 2018, pp.78-79, 130-131).","links":["https://en.wikipedia.org/wiki/Mississippian_culture"]}},{"name":"Polynesian expansion","c":{"f":"#92C8B8","s":"#4A8878"},"coords":[[-17,-150],[-22,-145],[-18,-140],[-16,-155]],"info":{"capital":"Society Islands (Tahiti area)","pop":"0.05-0.1 million","synopsis":"Polynesian voyagers had reached the Marquesas and Society Islands by 800 CE and were beginning the second great wave of Pacific exploration that would eventually reach Hawaii (~1000 CE), New Zealand (~1280 CE), and Easter Island (~1100 CE). Double-hulled outrigger canoes carried entire communities across thousands of miles of open ocean (Source: Snow 2018, pp.114-115).","links":["https://en.wikipedia.org/wiki/Polynesian_navigation"]}},{"name":"Srivijaya","c":{"f":"#92C8B8","s":"#4A8878"},"coords":[[5,95],[5,110],[-6,110],[-6,95]],"info":{"capital":"Palembang (Sumatra)","pop":"1-2 million","synopsis":"Srivijaya was the maritime trading empire of the Malay archipelago, controlling the Strait of Malacca and the trade between India, China, and the Spice Islands. A great Mahayana Buddhist center; the Chinese monk Yi Jing studied Sanskrit there for years en route to India.","links":[]}},{"name":"Viking expansion (emerging)","c":{"f":"#A0A0A0","s":"#606060"},"coords":[[68,5],[68,30],[57,30],[57,5]],"info":{"capital":"Various Norse kingdoms","pop":"1-2 million","synopsis":"The Viking Age had just exploded with the raid on Lindisfarne (793 CE). Norse seafarers were beginning the expansion that would settle Iceland (~870), Greenland (~985), and briefly Vinland (~1000). Sweden, Denmark, and Norway were coalescing into kingdoms; Norse traders were establishing the route down the Russian rivers to Constantinople.","links":[]}},{"name":"Khazar Khaganate","c":{"f":"#C09060","s":"#806030"},"coords":[[55,35],[58,55],[44,55],[42,38]],"info":{"capital":"Atil (Volga delta)","pop":"1-2 million","synopsis":"The Khazar Khaganate ruled the Pontic-Caspian steppe and the lower Volga, a Turkic-led federation that converted to Judaism around 740 CE — the only Jewish-led state of medieval times. Khazaria served as a buffer between the Arab caliphate and the Byzantine and Slavic worlds for two centuries.","links":[]}},{"name":"Pictland → Kingdom of Alba (forming)","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[59,-5],[59,-1],[56,-1],[56,-5]],"info":{"capital":"Various royal seats","pop":"0.2-0.4 million","synopsis":"The Picts and Gaels of northern Britain were merging into the Kingdom of Alba (the proto-Scotland) under Kenneth MacAlpin (843-858 CE); his predecessors were the kings of 800 CE. Viking raids were forcing the consolidation. The Picts as a distinct identity would disappear by 900 CE.","links":[]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Tuareg / Saharan nomads","c":{"f":"#C8A858","s":"#785828"},"coords":[[27,-12],[28,18],[23,22],[15,20],[14,5],[16,-10],[22,-15],[27,-12]],"peoples":true,"info":{"region":"Sahara desert — modern Mali, Niger, Algeria, Libya, Burkina Faso","lifeway":"Pastoral nomads (camels, goats); trans-Saharan caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Eurasian steppe nomads (pre-Mongol)","c":{"f":"#A8A8A8","s":"#404040"},"coords":[[52,30],[55,80],[52,115],[44,110],[40,80],[44,42],[48,32],[52,30]],"peoples":true,"info":{"region":"Eurasian steppe — Pannonia to Mongolia","lifeway":"Pastoral nomads (horses, sheep); mounted archers","languages":"Various Turkic, Mongolic, Indo-Iranian (Scythian, Sarmatian, Sogdian) languages","synopsis":"The Eurasian steppe was home to a succession of nomadic confederations — Scythians, Xiongnu, Huns, Avars, Göktürks, Uyghurs, Khazars, and many more — none of which fit the conventional definition of states but all of which projected periodic devastating power against sedentary empires from Han China to Rome to Sassanid Persia. The Mongols of 1206 were the culmination of this two-millennia tradition.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}}],"1000":[{"name":"Song Dynasty (Northern Song)","c":{"f":"#D4A060","s":"#947030"},"coords":[[42,108],[42,122],[38,123],[32,121],[28,120],[24,113],[22,108],[26,103],[32,103],[38,105]],"info":{"capital":"Bianjing (modern Kaifeng)","pop":"55-70 million","synopsis":"The Song dynasty had reunified most of China by 979 CE after the Five Dynasties chaos. By 1000 CE, Song China was inventing gunpowder weapons, movable-type printing (Bi Sheng, c.1040), the magnetic compass, and the first paper currency (jiaozi). Its capital Bianjing held nearly a million people — the largest city in the world (Source: Snow 2018, pp.118-119).","links":["https://en.wikipedia.org/wiki/Song_dynasty"]}},{"name":"Fatimid Caliphate","c":{"f":"#88B898","s":"#3A7A4A"},"coords":[[34,10],[34,32],[30,35],[24,35],[18,38],[15,40],[20,30],[28,18],[32,12]],"info":{"capital":"Cairo (founded 969 CE)","pop":"10-15 million","synopsis":"The Fatimid Caliphate, a Shia Ismaili dynasty, ruled from Cairo (which they founded in 969). At its peak under al-Hakim and his successors, it controlled North Africa, Egypt, the Levant, the Hijaz with Mecca and Medina, and Sicily. The Al-Azhar mosque-university (970 CE) became the intellectual center of the Shia world (Source: Snow 2018, pp.116-117).","links":["https://en.wikipedia.org/wiki/Fatimid_Caliphate"]}},{"name":"Byzantine Empire (Basil II)","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[44,12],[44,32],[42,40],[37,40],[35,32],[36,26],[39,22],[42,18]],"info":{"capital":"Constantinople","pop":"12-15 million","synopsis":"Under Basil II 'the Bulgar-Slayer' (976-1025), Byzantium reached its medieval peak: he recovered Bulgaria after a 30-year war, pushed the empire to its largest extent since Justinian, and left a treasury overflowing with gold. His death in 1025 marked the beginning of a long decline (Source: Snow 2018, pp.92-93, 122-123).","links":["https://en.wikipedia.org/wiki/Byzantine_Empire_under_the_Macedonian_dynasty"]}},{"name":"Caliphate of Cordoba","c":{"f":"#C09060","s":"#806030"},"coords":[[42,-9],[42,3],[38,4],[36,-2],[36,-9],[40,-9]],"info":{"capital":"Córdoba","pop":"7-10 million","synopsis":"Al-Andalus under Caliph Hisham II and his hajib al-Mansur was the most populous and prosperous polity in western Europe. Córdoba had paved streets, public baths, street lighting, and a library of 400,000 volumes — at a time when most European cities had a few thousand inhabitants and the largest libraries held a few hundred books (Source: Snow 2018, pp.116-117).","links":["https://en.wikipedia.org/wiki/Caliphate_of_C%C3%B3rdoba"]}},{"name":"Ghana Empire","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[20,-12],[20,0],[16,5],[12,8],[10,2],[10,-10],[14,-14],[18,-14]],"info":{"capital":"Koumbi Saleh","pop":"1-3 million","synopsis":"By 1000 CE the Ghana Empire was at or near its peak under the Soninke kings of Wagadu. Arab geographers describe a wealthy kingdom whose monarch held court in a stone-built palace and whose army could field 200,000 soldiers including 40,000 archers (Source: Snow 2018, pp.108-109).","links":["https://en.wikipedia.org/wiki/Ghana_Empire"]}},{"name":"Holy Roman Empire (Otto III)","c":{"f":"#A8A8A8","s":"#606060"},"coords":[[55,5],[56,15],[51,18],[47,17],[45,12],[45,7],[48,5],[52,4]],"info":{"capital":"Aachen / Rome","pop":"8-10 million","synopsis":"Otto III (980-1002), the visionary boy-emperor, briefly made Rome his capital and dreamed of reviving the Roman Empire as a Christian commonwealth that included his cousin Stephen of Hungary and Bolesław of Poland. He died at 21; his dream died with him, but the Ottonian renaissance carried into the new millennium (Source: Snow 2018, pp.120-121).","links":["https://en.wikipedia.org/wiki/Holy_Roman_Empire"]}},{"name":"Kievan Rus","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[59,28],[60,40],[55,42],[50,38],[48,32],[51,25]],"info":{"capital":"Kiev","pop":"5-8 million","synopsis":"Prince Vladimir the Great had been baptized in 988 CE and chose Byzantine (Orthodox) Christianity as the state religion, sending mass baptisms into the Dnieper. By 1000 CE, his son Yaroslav the Wise was consolidating the largest state in Europe — a federation of east-Slavic principalities tied to Constantinople by trade and faith (Source: Snow 2018, pp.122-123).","links":["https://en.wikipedia.org/wiki/Kievan_Rus%27"]}},{"name":"Chola Empire","c":{"f":"#D4A0A0","s":"#9A4A4A"},"coords":[[14,76],[14,82],[10,82],[8,79],[8,76],[11,75]],"info":{"capital":"Thanjavur","pop":"8-12 million","synopsis":"Under Rajaraja I (985-1014) and his son Rajendra I, the Chola Empire of southern India became a maritime power that raided Srivijaya (Sumatra) and dominated trade across the Bay of Bengal. The great Brihadeeswara temple at Thanjavur was completed in 1010 CE (Source: Snow 2018, pp.124-125).","links":["https://en.wikipedia.org/wiki/Chola_dynasty"]}},{"name":"Toltec","c":{"f":"#B89870","s":"#705028"},"coords":[[22,-101],[22,-97],[19,-96],[18,-99],[18,-102],[21,-103]],"info":{"capital":"Tula","pop":"1-2 million","synopsis":"The Toltec polity at Tula (modern Hidalgo, Mexico) succeeded Teotihuacán and preceded the Aztecs as the central Mexican hegemon. Toltec craftsmen, warriors, and the legendary king Topiltzin-Quetzalcoatl became culture heroes whom the later Aztecs idolized as the source of all civilization (Source: Snow 2018, pp.130-131).","links":["https://en.wikipedia.org/wiki/Toltec"]}},{"name":"Mississippian (Cahokia)","c":{"f":"#B89070","s":"#705038"},"coords":[[40,-95],[40,-83],[35,-82],[32,-85],[31,-92],[35,-95]],"info":{"capital":"Cahokia (peak by 1100)","pop":"0.3-0.5 million","synopsis":"Cahokia near modern St. Louis was growing rapidly toward its 12th-century peak of perhaps 15,000-20,000 residents — the largest city in North America until Philadelphia overtook it in the late 18th century. Earthen mounds, a Grand Plaza, and Woodhenge solar observatories were under construction (Source: Snow 2018, pp.130-131).","links":["https://en.wikipedia.org/wiki/Cahokia"]}},{"name":"Polynesian (reach Hawaii)","c":{"f":"#92C8B8","s":"#4A8878"},"coords":[[20,-156],[22,-159],[22,-155],[19,-155],[18,-156]],"info":{"capital":"Voyaging chiefdoms","pop":"0.1-0.2 million","synopsis":"Polynesian navigat ],[10,-12],[16,-15]],"info":{"capital":"Niani","pop":"3-5 million","synopsis":"The Mali Empire was forming out of the wreckage of Ghana's collapse, as the Sundiata Keita epic narrates. By 1235 Sundiata would unite the Mandinka chieftains at the Battle of Kirina and proclaim the Mali Empire formally. By 1200 his Keita family was consolidating power on the upper Niger (Source: Snow 2018, pp.108-109).","links":["https://en.wikipedia.org/wiki/Mali_Empire"]}},{"name":"Southern Song","c":{"f":"#D4A060","s":"#947030"},"coords":[[34,107],[34,118],[32,121.5],[28,122],[24,118],[22,114],[21,109],[24,104],[28,100],[32,103],[34,107]],"info":{"capital":"Lin'an (modern Hangzhou)","pop":"60-80 million","synopsis":"After the Jin (Jurchen) conquest of north China in 1127, the Song court fled south and re-established at Lin'an. Southern Song China was the most economically advanced society in the world — paper money, joint-stock companies, gunpowder weapons, the magnetic compass, and a market economy unmatched until early-modern Europe (Source: Snow 2018, pp.118-119).","links":["https://en.wikipedia.org/wiki/Song_dynasty"]}},{"name":"Cahokia (peak)","c":{"f":"#B89070","s":"#705038"},"coords":[[40,-95],[40,-83],[35,-82],[32,-85],[32,-93],[36,-95]],"info":{"capital":"Cahokia","pop":"0.4-0.6 million","synopsis":"Cahokia reached its peak around 1100-1200 CE with perhaps 15,000-20,000 residents, the largest urban center in North America until the late 18th century. The Monks Mound, a 30-meter earthen pyramid larger at its base than the Great Pyramid of Giza, dominated the central plaza (Source: Snow 2018, pp.130-131).","links":["https://en.wikipedia.org/wiki/Cahokia"]}},{"name":"Almohad Caliphate","c":{"f":"#A8B070","s":"#608030"},"coords":[[40,-9],[40,-3],[37,-2.5],[36.5,-1],[36,3],[36.5,8],[35.5,11],[33,11],[30,5],[28,-2],[28,-9],[31,-10.5],[35,-8],[40,-9]],"info":{"capital":"Marrakesh / Seville","pop":"12-15 million","synopsis":"The Almohad Caliphate, a Berber Muslim dynasty preaching a ttps://en.wikipedia.org/wiki/Pagan_Kingdom"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, ginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Tuareg / Saharan nomads","c":{"f":"#C8A858","s":"#785828"},"coords":[[27,-12],[28,18],[23,22],[15,20],[14,5],[16,-10],[22,-15],[27,-12]],"peoples":true,"info":{"region":"Sahara desert — modern Mali, Niger, Algeria, Libya, Burkina Faso","lifeway":"Pastoral nomads (camels, goats); trans-Saharan caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Maori (Aotearoa)","c":{"f":"#90B098","s":"#385838"},"coords":[[-34,172],[-37,178],[-41,176],[-46,167],[-46,166],[-41,172],[-34,172]],"peoples":true,"info":{"region":"Aotearoa / New Zealand","lifeway":"Horticulturalists (kumara/sweet potato) + fishers + bird-hunters","languages":"Te Reo Maori (Eastern Polynesian language family)","synopsis":"The Maori arrived in Aotearoa from East Polynesia around 1280 CE — the last major landmass on Earth to be settled by humans. They developed iwi (tribal) and hapu (sub-tribal) political structures, sophisticated agriculture, and a rich oral and artistic tradition. James Cook's 1769 arrival and the Treaty of Waitangi (1840) opened a long and contested relationship with the Crown.","links":[]}},{"name":"Amazonian people ion","synopsis":"The Triple Alliance (Tenochtitlan, Texcoco, Tlacopan) under Moctezuma I (1440-1469) was conquering most of central Mexico. The Great Pyramid of Tenochtitlan was being rebuilt larger; tribute lists in pictographic codices recorded the empire's growing reach (Source: Snow 2018, pp.150-151).","links":[]}},{"name":"Vijayanagara Empire (Devaraya II)","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[18,74],[18,82],[10,82],[8,77],[12,73],[18,74]],"info":{"capital":"Vijayanagara (Hampi)","pop":"18-22 million","synopsis":"Devaraya II (1422-1446) had brought Vijayanagara to its first peak as a Hindu bulwark against the Bahmani sultanates of the Deccan. Persian and Italian visitors marveled at Hampi's grandeur. The empire would have a second peak under Krishnadevaraya half a century later.","links":[]}},{"name":"Joseon Korea (Sejong the Great)","c":{"f":"#92A8C0","s":"#506888"},"coords":[[42,124],[43,131],[36,131],[34,128],[36,125],[42,124]],"info":{"capital":"Hanseong (Seoul)","pop":"5-7 million","synopsis":"Sejong the Great (1418-1450) had just promulgated the Hangul Korean alphabet in 1443 — one of history's most successful designed writing systems. His reign also produced the first Korean rain gauge, sundials, water clocks, and movable metal type.","links":[]}},{"name":"Ashikaga Japan (Onin War brewing)","c":{"f":"#A8B8D0","s":"#506888"},"coords":[[42,140],[42,145],[36,142],[33,131],[35,135],[42,140]],"info":{"capital":"Kyoto","pop":"10-12 million","synopsis":"Shogun Ashikaga Yoshimasa (1449-1473) reigned over a Japan slipping toward the Sengoku (Warring States) period. The Onin War would erupt in 1467, devastating Kyoto and triggering a century of civil war among regional daimyo.","links":[]}},{"name":"Valois France (Charles VII)","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[51,-2],[51,8],[44,7],[43,-1],[45,-2],[48,-5],[51,-2]],"info":{"capital":"Bourges / Paris (recovered 1437)","pop":"12-15 million","synopsis":"Charles VII 'the Victorious' had recovered Par a just won)","c":{"f":"#D4B870","s":"#947830"},"coords":[[44,-9],[44,3],[36,-1],[36,-9],[40,-9]],"info":{"capital":"Toledo / Valladolid (itinerant court)","pop":"6-8 million","synopsis":"The Catholic Monarchs Ferdinand and Isabella had completed the Reconquista by taking Granada in 1492. The same year, Columbus reached Hispaniola; Spain expelled its Jews. Spain was about to inherit a global empire from Charles V (born 1500, would rule from 1516). The conquistadors were waiting in the wings (Source: Snow 2018, pp.156-159).","links":["https://en.wikipedia.org/wiki/Spanish_Empire"]}},{"name":"Songhai Empire","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[21,-10],[20,0],[18,5],[14,5.5],[11,2],[9.5,-4],[11,-10],[14,-13],[18,-13],[21,-10]],"info":{"capital":"Gao","pop":"10-15 million","synopsis":"The Songhai Empire under Askia Muhammad (1493-1528) had succeeded Mali as the West African Sahel superpower, building on the trans-Saharan gold-and-salt trade. Timbuktu's Sankore Madrasa was an Islamic university with thousands of students. Songhai would be destroyed by a Moroccan invasion in 1591 (Source: Snow 2018, pp.108-109).","links":["https://en.wikipedia.org/wiki/Songhai_Empire"]}},{"name":"Polish-Lithuanian state","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[56.5,18],[56,27],[54.5,29],[50,30],[48,28],[48,22],[49.5,18],[50.5,14.5],[54,14],[55,16],[56.5,18]],"info":{"capital":"Kraków / Vilnius","pop":"7-9 million","synopsis":"The Jagiellonian dynasty ruled both Poland and Lithuania (formally united as the Commonwealth in 1569). The state stretched from the Baltic to near the Black Sea, the largest in Europe by area. King John I Albert reigned; his brother Alexander would succeed him (Source: Snow 2018, pp.146-147).","links":["https://en.wikipedia.org/wiki/Crown_of_the_Kingdom_of_Poland"]}},{"name":"Ethiopian Empire (Solomonic)","c":{"f":"#88A878","s":"#487048"},"coords":[[16,36],[16,42],[10,42],[7,38],[10,33],[14,34]],"info":{"capital":"Itinerant royal camp","pop":"3-5 million","synopsis":"Emperor Eskender (1478-1494) had just died; the Solomonic dynasty ruled Christian highland Ethiopia, which had maintained its independence since the 4th century. The Ahmad Gragn jihad (1529-1543) would shortly devastate the country until Portuguese musketeers arrived to help repel it (Source: Snow 2018, pp.116-117).","links":["https://en.wikipedia.org/wiki/Ethiopian_Empire"]}},{"name":"Vijayanagara Empire","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[18,74],[18,82],[10,82],[8,76],[12,74]],"info":{"capital":"Vijayanagara (Hampi)","pop":"20-25 million","synopsis":"The Vijayanagara Empire under Krishnadevaraya (1509-1529) would be approaching its peak as the dominant Hindu power of south India and rival to the Bahmani sultanates of the Deccan. Hampi was one of the largest cities in the world. The empire would collapse in 1565 at the Battle of Talikota (Source: Snow 2018, pp.126-127).","links":["https://en.wikipedia.org/wiki/Vijayanagara_Empire"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Tuareg / Saharan nomads","c":{"f":"#C8A858","s":"#785828"},"coords":[[27,-12],[28,18],[23,22],[15,20],[14,5],[16,-10],[22,-15],[27,-12]],"peoples":true,"info":{"region":"Sahara desert — modern Mali, Niger, Algeria, Libya, Burkina Faso","lifeway":"Pastoral nomads (camels, goats); trans-Saharan caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Iroquois Confederacy (Haudenosaunee)","c":{"f":"#88A878","s":"#3A5A2A"},"coords":[[45,-79],[45,-73],[42,-73],[42,-79],[45,-79]],"peoples":true,"info":{"region":"Northeastern woodlands — modern New York state and adjacent Ontario / Quebec","lifeway":"Agriculturalists + hunters (Three Sisters: corn, beans, squash); longhouse villages","languages":"Five (later Six) Iroquoian languages: Mohawk, Oneida, Onondaga, Cayuga, Seneca (+ Tuscarora 1722)","synopsis":"The Haudenosaunee Confederacy was founded by the Great Peacemaker around 1142 CE (traditional) uniting five (later six) nations under the Great Law of Peace — a sophisticated federal constitution that influenced Enlightenment political thinkers including Benjamin Franklin. They dominated Northeastern trade and warfare into the colonial period; the American Revolution split the Confederacy.","links":[]}},{"name":"Maori (Aotearoa)","c":{"f":"#90B098","s":"#385838"},"coords":[[-34,172],[-37,178],[-41,176],[-46,167],[-46,166],[-41,172],[-34,172]],"peoples":true,"info":{"region":"Aotearoa / New Zealand","lifeway":"Horticulturalists (kumara/sweet potato) + fishers + bird-hunters","languages":"Te Reo Maori (Eastern Polynesian language family)","synopsis":"The Maori arrived in Aotearoa from East Polynesia around 1280 CE — the last major landmass on Earth to be settled by humans. They developed iwi (tribal) and hapu (sub-tribal) political structures, sophisticated agriculture, and a rich oral and artistic tradition. James Cook's 1769 arrival and the Treaty of Waitangi (1840) opened a long and contested relationship with the Crown.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}}],"1600":[{"name":"Spanish Habsburg Empire","c":{"f":"#D4B870","s":"#947830"},"coords":[[43.8,-9.3],[43.8,-1.5],[42.4,3.3],[41,3.2],[38.7,0],[36.8,-2.2],[36,-5.6],[37.2,-7.5],[37.4,-8.8],[39.6,-9.5],[41.5,-8.9],[43.8,-9.3]],"info":{"capital":"Madrid (from 1561)","pop":"8-10 million (Iberia); 20M+ counting Americas","synopsis":"Philip III had just succeeded Philip II in 1598; the Spanish Empire was the world's first 'empire on which the sun never sets,' spanning Iberia, the Netherlands, most of Italy, Mexico, Peru, the Philippines, and outposts across Asia. American silver from Potosí funded the Habsburg wars (Source: Snow 2018, pp.158-159).","links":["https://en.wikipedia.org/wiki/Spanish_Empire"]}},{"name":"Portuguese maritime empire","c":{"f":"#88B898","s":"#3A7A4A"},"coords":[[42,-10],[42,-7],[38,-7],[37,-9],[40,-10]],"info":{"capital":"Lisbon (under Spanish crown 1580-1640)","pop":"1.5 million (home)","synopsis":"Since 1580, Portugal had been under the Iberian Union with Spain — Philip II had inherited the Portuguese throne. Portuguese Asia (Estado da Índia) ran from Goa, Malacca, and Macau; Brazil's sugar plantations were booming. Dutch competition was about to break the spice monopoly (Source: Snow 2018, pp.156-159).","links":["https://en.wikipedia.org/wiki/Portuguese_Empire"]}},{"name":"Mughal Empire (Akbar)","c":{"f":"#D4B060","s":"#946830"},"coords":[[35,72],[35,77],[32,82],[28,90],[26,92],[22,92],[22,88],[20,85],[16,80],[20,73],[24,68],[28,66],[35,72]],"info":{"capital":"Agra (then Fatehpur Sikri)","pop":"100-115 million","synopsis":"Akbar the Great (1556-1605) reigned over the Mughal Empire at its cultural peak, a multi-religious state where Hindus served as generals and ministers alongside Muslims. His Din-i-Ilahi religious synthesis attempted to unite faiths; his administrative reforms (mansabdari, zabt land revenue) outlived him (Source: Snow 2018, pp.162-165).","links":["https://en.wikipedia.org/wiki/Mughal_Empire"]}},{"name":"Ming Dynasty (late)","c":{"f":"#D4A060","s":"#947030"},"coords":[[42,103],[42,118],[40,122],[36,123],[32,121.5],[28,121.5],[24,118],[22,114],[22,108],[25,104],[28,98],[32,98],[35,100],[38,103],[40,105],[42,103]],"info":{"capital":"Beijing","pop":"150-170 million","synopsis":"The Wanli Emperor (1572-1620) ruled the Ming through decades of palace withdrawal that historians blame for the dynasty's coming collapse. Silver imports from Spanish America via Manila reshaped the Ming economy. Matteo Ricci was in Beijing (Source: Snow 2018, pp.152-153).","links":["https://en.wikipedia.org/wiki/Ming_dynasty"]}},{"name":"Tokugawa Japan","c":{"f":"#A8B8D0","s":"#506888"},"coords":[[45.5,142.5],[45,145],[41.5,145.5],[38.5,141.5],[35,140.9],[34.5,139.5],[34,135],[32.5,131],[31,130.5],[33,129.5],[34.5,131.5],[35.5,132],[37.5,137],[39.5,139.5],[41.5,141],[43,140.5],[44,141.5],[45.5,142.5]],"info":{"capital":"Edo (modern Tokyo)","pop":"18-22 million","synopsis":"Tokugawa Ieyasu had just won the Battle of Sekigahara (October 1600), the decisive victory that would make him shogun in 1603 and inaugurate 260 years of Tokugawa rule. Japan was about to close itself to most foreign contact (sakoku, formalized 1635-1639) (Source: Snow 2018, pp.166-167).","links":["https://en.wikipedia.org/wiki/Tokugawa_shogunate"]}},{"name":"Ottoman Empire","c":{"f":"#C09060","s":"#806030"},"coords":[[44,18],[44,40],[34,46],[28,42],[24,32],[28,18],[36,16],[40,20]],"info":{"capital":"Istanbul","pop":"28-32 million","synopsis":"Mehmed III had just won at Mezőkeresztes (1596) against the Habsburgs. The Ottomans ruled from Algiers to Baghdad to the gates of Vienna, the dominant Sunni Muslim power and the largest Mediterranean state. The 'Sublime State' would peak under Süleyman's successors before the long stagnation (Source: Snow 2018, pp.146-149).","links":["https://en.wikipedia.org/wiki/Ottoman_Empire"]}},{"name":"Safavid Persia (Shah Abbas)","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[40,44],[40,62],[36,63],[30,62],[25.5,60.5],[25.5,57],[27,52],[28.5,48.5],[33,46],[37,44],[40,44]],"info":{"capital":"Isfahan (capital from 1598)","pop":"8-12 million","synopsis":"Shah Abbas I the Great (1588-1629) was transforming Safavid Persia into a centralized state with a standing army of slave-soldiers (ghulam) modeled on the Ottoman janissaries. He'd just made Isfahan the capital, where his new Naqsh-e Jahan Square would become one of the largest urban plazas in the world (Source: Snow 2018, pp.146-147).","links":["https://en.wikipedia.org/wiki/Safavid_dynasty"]}},{"name":"Elizabethan England","c":{"f":"#A0B870","s":"#608030"},"coords":[[55.7,-1.5],[54,-0.3],[52.1,1.6],[51.3,1.4],[51,-0.5],[50.7,-2.4],[50.3,-4.1],[50.7,-5.5],[51.7,-5.5],[52.4,-4.5],[53.4,-4.7],[53.6,-3.8],[55,-3],[55.7,-1.5]],"info":{"capital":"London","pop":"4-5 million","synopsis":"Elizabeth I had reigned since 1558; in 1600 she was in her last years (d.1603) and chartered the East India Company on the very last day of the century (31 December 1600). Defeat of the Spanish Armada (1588) had launched England's maritime ambitions. Shakespeare was writing 'Hamlet' (Source: Snow 2018, pp.160-161).","links":["https://en.wikipedia.org/wiki/Elizabethan_era"]}},{"name":"French Kingdom (Henry IV)","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[51,2.5],[50.5,4.2],[49.5,5.5],[48,7],[47,7],[45.5,6.5],[43.7,7.5],[43,9.2],[42.6,3.2],[43.5,-1.6],[45,-1.2],[47,-2.5],[48.5,-4.7],[48.7,-1.5],[50,-1.2],[50.9,1.6],[51,2.5]],"info":{"capital":"Paris","pop":"18-22 million","synopsis":"Henry IV (1589-1610) had ended the Wars of Religion with the Edict of Nantes (1598), tolerating Protestants in a Catholic kingdom. on":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Tuareg / Saharan nomads","c":{"f":"#C8A858","s":"#785828"},"coords":[[27,-12],[28,18],[23,22],[15,20],[14,5],[16,-10],[22,-15],[27,-12]],"peoples":true,"info":{"region":"Sahara desert — modern Mali, Niger, Algeria, Libya, Burkina Faso","lifeway":"Pastoral nomads (camels, goats); trans-Saharan caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Iroquois Confederacy (Haudenosaunee)","c":{"f":"#88A878","s":"#3A5A2A"},"coords":[[45,-79],[45,-73],[42,-73],[42,-79],[45,-79]],"peoples":true,"info":{"region":"Northeastern woodlands — modern New York state and adjacent Ontario / Quebec","lifeway":"Agriculturalists + hunters (Three Sisters: corn, beans, squash); longhouse villages","languages":"Five (later Six) Iroquoian languages: Mohawk, Oneida, Onondaga, Cayuga, Seneca (+ Tuscarora 1722)","synopsis":"The Haudenosaunee Confederacy was founded by the Great P  to a co-equal kingdom of Portugal and the Algarves. His son Pedro would declare Brazilian independence in 1822 (Source: Snow 2018, pp.156-159, 206-207).","links":["https://en.wikipedia.org/wiki/United_Kingdom_of_Portugal,_Brazil_and_the_Algarves"]}},{"name":"Spanish Empire (decaying)","c":{"f":"#D4A060","s":"#947030"},"coords":[[43.8,-9.3],[43.8,-1.5],[42.4,3.3],[41,3.2],[38.7,0],[36.8,-2.2],[36,-5.6],[37.2,-7.5],[37.4,-8.8],[39.6,-9.5],[41.5,-8.9],[43.8,-9.3]],"info":{"capital":"Madrid","pop":"11-13 million (Iberia)","synopsis":"Ferdinand VII (restored 1814) had abrogated the liberal Cádiz Constitution of 1812 and was trying to hold the empire together. Most Latin American colonies were already in revolt: Bolívar in Venezuela/Colombia, San Martín in Argentina, soon Chile and Peru. The empire would lose nearly all of mainland America by 1825 (Source: Snow 2018, pp.206-207).","links":["https://en.wikipedia.org/wiki/Spanish_Empire"]}},{"name":"Tokugawa Japan (late)","c":{"f":"#A8B8D0","s":"#506888"},"coords":[[42,140],[42,145],[36,142],[32,131],[35,135]],"info":{"capital":"Edo","pop":"30-31 million","synopsis":"Tokugawa Ienari (1787-1837), the eleventh Tokugawa shogun, presided over a long but increasingly troubled isolation. The Bunka-Bunsei era saw urban culture flourish but rural distress and famine spread. Russian, British, and American ships were appearing off the Japanese coast (Source: Snow 2018, pp.166-167)._","links":["https://en.wikipedia.org/wiki/Tokugawa_shogunate"]}},{"name":"Joseon Korea","c":{"f":"#92A8C0","s":"#506888"},"coords":[[42,124],[43,131],[36,131],[34,128],[36,125]],"info":{"capital":"Hanseong (modern Seoul)","pop":"8-9 million","synopsis":"Sunjo of Joseon (1800-1834) ruled a Korea in the grip of the Andong Kim regent clan. Catholic persecutions intensified; Hong Gyeong-nae's rebellion (1811-1812) exposed elite-commoner tensions. Korea remained largely closed to outsiders, a tributary of the Qing (Source: Snow 2018, pp.118-119)_","links":["https://en.wikipedia.org/wiki/Joseon"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish tra / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Tuareg / Saharan nomads","c":{"f":"#C8A858","s":"#785828"},"coords":[[27,-12],[28,18],[23,22],[15,20],[14,5],[16,-10],[22,-15],[27,-12]],"peoples":true,"info":{"region":"Sahara desert — modern Mali, Niger, Algeria, Libya, Burkina Faso","lifeway":"Pastoral nomads (camels, goats); trans-Saharan caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Iroquois Confederacy (Haudenosaunee)","c":{"f":"#88A878","s":"#3A5A2A"},"coords":[[45,-79],[45,-73],[42,-73],[42,-79],[45,-79]],"peoples":true,"info":{"region":"Northeastern woodlands — modern New York state and adjacent Ontario / Quebec","lifeway":"Agriculturalists + hunters (Three Sisters: corn, beans, squash); longhouse villages","languages":"Five (later Six) Iroquoian languages: Mohawk, Oneida, Onondaga, Cayuga, Seneca (+ Tuscarora 1722)","synopsis":"The Haudenosaunee Confederacy was founded by the Great Peacemaker around 1142 CE (traditional) uniting five (later six) nations under the Great Law of Peace — a sophisticated federal constitution that influenced Enlightenment political thinkers including Benjamin Franklin. They dominated Northeastern trade and warfare into the colonial period; the American Revolution split the Confederacy.","links":[]}},{"name":"Maori (Aotearoa)","c":{"f":"#90B098","s":"#385838"},"coords":[[-34,172],[-37,178],[-41,176],[-46,167],[-46,166],[-41,172],[-34,172]],"peoples":true,"info":{"region":"Aotearoa / New Zealand","lifeway":"Horticulturalists (kumara/sweet potato) + fishers + bird-hunters","languages":"Te Reo Maori (Eastern Polynesian language family)","synopsis":"The Maori arrived in Aotearoa from East Polynesia around 1280 CE — the last major landmass on Earth to be settled by humans. They developed iwi (tribal) and hapu (sub-tribal) political structures, sophisticated agriculture, and a rich oral and artistic tradition. James Cook's 1769 arrival and the Treaty of Waitangi (1840) opened a long and contested relationship with the Crown.","links":[]}},{"name":"Plains peoples (Great Plains)","c":{"f":"#B89878","s":"#604030"},"coords":[[49,-114],[49,-95],[40,-92],[31,-100],[31,-104],[40,-110],[49,-114]],"peoples":true,"info":{"region":"Great Plains — modern Montana, Dakotas, Nebraska, Kansas, Oklahoma, Texas, Colorado, Wyoming","lifeway":"Equestrian hunters (buffalo / bison); semi-nomadic following the herds","languages":"Lakota / Dakota / Nakota (Sioux); Cheyenne; Comanche; Arapaho; Kiowa; Blackfoot","synopsis":"The Plains peoples acquired horses from Spanish colonial New Mexico in the late 1600s, transforming from semi-sedentary villagers into the iconic equestrian buffalo hunters of North American mythology. The Comanche Empire dominated the southern Plains; the Lakota the northern Plains. The buffalo herds and the political independence of the Plains nations were destroyed in a single generation, 1865-1890, by US Army campaigns and railroad expansion.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[ oetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}}],"1900":[{"name":"British Empire (home)","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[58.6,-3],[58.5,-1.5],[57.8,-1.6],[56.4,-2.5],[55.7,-1.5],[54,-0.3],[52.1,1.6],[51.3,1.4],[51,-0.5],[50.7,-2.4],[50.3,-4.1],[50.7,-5.5],[51.7,-5.5],[52.4,-4.5],[53.4,-4.7],[53.6,-3.8],[52.1,-10.4],[53.6,-10.3],[55.3,-7.6],[54.7,-5.9],[54,-6],[55,-3],[55.8,-5],[57,-5.5],[58,-4.7],[58.6,-3]],"info":{"capital":"London","pop":"42 million","synopsis":"Queen Victoria's reign was in its final year (d.January 1901). The British Empire covered roughly a quarter of Earth's land and population — Canada, India, Australia, New Zealand, much of Africa, the Caribbean, Singapore, Hong Kong. The Second Boer War (1899-1902) was bogging down a great power against farmer guerrillas (Source: Snow 2018, pp.218-221).","links":["https://en.wikipedia.org/wiki/British_Empire"]}},{"name":"Russian Empire","c":{"f":"#A0A0A0","s":"#606060"},"coords":[[69.5,30],[69,40],[71,55],[73,70],[73,85],[75,100],[76,115],[71,135],[65,165],[60,170],[50,156],[42,134],[42,118],[44,90],[42,80],[38,70],[36,62],[38,52],[42,45],[42,42],[47,38],[47,32],[50,24],[54,20],[55,22],[60,28],[63,30],[69.5,30]],"info":{"capital":"St. Petersburg","pop":"130 million","synopsis":"Tsar Nicholas II (1894-1917) ruled a vast empire industrializing in fits and starts. The Trans-Siberian Railway was nearly complete; Russia was about to lose the Russo-Japanese War (1904-1905) and face the 1905 revolution. The autocracy was on borrowed time (Source: Snow 2018, pp.218-219).","links":["https://en.wikipedia.org/wiki/Russian_Empire"]}},{"name":"German Empire","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[55,8],[55.3,11],[54.5,14],[55,17],[54.8,20.5],[54.5,22.8], haran caravan traders","languages":"Tamasheq (Berber family), written in Tifinagh script","synopsis":"The Tuareg are a Berber-speaking pastoral confederation of the central Sahara, organized into matrilineal-influenced tribal confederations under tribal chiefs (amenokals). They controlled the trans-Saharan trade routes that moved gold north and salt south for over a millennium, never quite forming a state but routinely shaping the fortunes of Sahel empires from Ghana through Songhai.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}}],"2000":[{"modern":true,"label":"Modern world (current borders)"}],"-3000":[{"name":"Ancient Egypt","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[31.5,29.8],[31.4,30.8],[31.5,32.2],[30.7,32.6],[29.6,32.8],[28.4,33],[27,33.6],[25.7,34.4],[24.2,33.2],[22.5,31.9],[22,31.6],[22.3,30.7],[24,30.6],[25.5,30.5],[26.5,30.4],[28,30.2],[29.4,30.1],[30.4,30]],"info":{"capital":"Memphis (founded c.3100 BCE by Narmer)","pop":"~1 million","synopsis":"Egypt has just been unified by Narmer (c.3100 BCE), joining Upper and Lower Egypt under a single pharaoh. Settlement is anchored to the Nile from the Mediterranean delta south to Aswan, plus a contact zone into Nubia. Hieroglyphic writing, mudbrick towns, and a centralized pharaonic administration are emerging. The Old Kingdom and the great pyramids are still 500 years away.","links":["https://en.wikipedia.org/wiki/Early_Dynastic_Period_(Egypt)","https://en.wikipedia.org/wiki/Predynastic_Egypt"]}},{"name":"Sumer","c":{"f":"#B08858","s":"#705030"},"coords":[[37.4,36],[37.2,38.5],[36.8,40.5],[36.5,42],[36,43.5],[35,45.5],[33.5,46.5],[
