<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChronoAtlas — The World Through Time</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#EEF2E8;--bg2:#E4E8DC;--bg3:#D8DCD0;
--text:#2C3E2A;--text2:#5A6858;--text3:#8A9888;
--accent:#4A7A50;--accent2:#2E5A34;
--panel-w:380px;
--serif:'Source Serif 4',Georgia,serif;
--sans:'DM Sans',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text)}
#app{display:flex;height:100%;position:relative;overflow:hidden}
#map{flex:1;height:100%;z-index:1}
.leaflet-control-zoom{border:none!important}
.leaflet-control-zoom a{background:rgba(238,242,232,0.92)!important;color:var(--text)!important;border:1px solid var(--bg3)!important;width:32px!important;height:32px!important;line-height:32px!important;font-size:16px!important}
.leaflet-control-zoom a:hover{background:var(--bg2)!important}
.leaflet-popup-content-wrapper{border-radius:10px;font-family:var(--sans);box-shadow:0 4px 20px rgba(0,0,0,0.12)}
#topbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;align-items:center;gap:12px;padding:8px 16px;background:rgba(238,242,232,0.92);backdrop-filter:blur(12px);border-radius:12px;border:1px solid var(--bg3);box-shadow:0 2px 20px rgba(0,0,0,0.08)}
#topbar h1{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--accent2);white-space:nowrap}
#topbar .sep{width:1px;height:24px;background:var(--bg3)}
#search-box{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:8px;padding:4px 10px;border:1px solid transparent;transition:border-color .2s}
#search-box:focus-within{border-color:var(--accent)}
#search-input{border:none;outline:none;background:transparent;font-family:var(--sans);font-size:13px;width:200px;color:var(--text)}
#search-input::placeholder{color:var(--text3)}
.icon-search{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2}
#compare-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
#compare-btn:hover{background:var(--bg2);border-color:var(--accent)}
#compare-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
#compare-bar{display:none;position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(238,242,232,0.92);backdrop-filter:blur(12px);border-radius:10px;border:1px solid var(--bg3);padding:8px 16px;box-shadow:0 2px 20px rgba(0,0,0,0.08);gap:10px;align-items:center}
#compare-bar.visible{display:flex}
#compare-bar label{font-size:12px;color:var(--text2);font-weight:500}
.compare-year-input{width:80px;padding:4px 6px;border-radius:6px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);text-align:center;outline:none}
#compare-go{padding:4px 14px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:500;cursor:pointer}

#timeline{position:absolute;bottom:0;left:0;right:0;z-index:1000;padding:12px 24px 16px;background:linear-gradient(transparent,rgba(238,242,232,0.97) 30%)}
#timeline-inner{display:flex;align-items:center;gap:12px}
#play-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bg3);background:rgba(238,242,232,0.9);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#play-btn:hover{background:var(--bg2)}
#play-btn svg{width:14px;height:14px;fill:var(--text)}
#slider-wrap{flex:1}
#year-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--bg3);outline:none;cursor:pointer}
#year-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,0.25);cursor:grab}
#year-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,0.25);cursor:grab}
#era-markers{display:flex;justify-content:space-between;margin-top:4px}
#era-markers span{font-size:10px;color:var(--text3)}
#year-input-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
#year-input{width:72px;padding:6px 8px;border-radius:8px;border:1px solid var(--bg3);background:rgba(238,242,232,0.9);font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text);text-align:center;outline:none}
#year-input:focus{border-color:var(--accent)}
#year-era{font-size:12px;color:var(--text2);font-weight:500;cursor:pointer;padding:4px 6px;border-radius:4px;user-select:none}
#year-era:hover{background:var(--bg2)}
#year-display{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--accent2);min-width:120px;text-align:center;flex-shrink:0}

#side-panel{position:absolute;top:0;right:0;width:var(--panel-w);height:100%;background:rgba(238,242,232,0.96);backdrop-filter:blur(16px);z-index:1001;transform:translateX(100%);transition:transform .3s ease;border-left:1px solid var(--bg3);overflow-y:auto;display:flex;flex-direction:column}
#side-panel.open{transform:translateX(0)}
#panel-header{padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--bg3)}
#panel-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#panel-close:hover{background:var(--bg2)}
#panel-title{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--text)}
#panel-subtitle{font-size:12px;color:var(--text2);margin-top:2px}
#panel-body{padding:16px 20px;flex:1}
.panel-section{margin-bottom:16px}
.panel-section h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);margin-bottom:6px;font-weight:600}
.panel-section p{font-size:14px;line-height:1.65;color:var(--text)}
.panel-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:8px;padding:10px 12px}
.stat-card .label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);font-weight:500}
.stat-card .value{font-size:16px;font-weight:600;color:var(--text);margin-top:2px}
.panel-links a{font-size:13px;color:var(--accent);text-decoration:none;display:block;margin-bottom:4px}
.panel-links a:hover{text-decoration:underline}

#legend{position:absolute;bottom:90px;left:16px;z-index:1000;background:rgba(238,242,232,0.92);backdrop-filter:blur(12px);border-radius:10px;border:1px solid var(--bg3);padding:12px 16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);max-width:220px}
#legend h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;font-weight:600}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.legend-swatch{width:16px;height:11px;border-radius:2px;flex-shrink:0}
.legend-label{font-size:11px;color:var(--text2)}

.event-popup .title{font-family:var(--serif);font-weight:600;font-size:14px;margin-bottom:4px;color:#2C3E2A}
.event-popup .desc{font-size:12px;color:#555;line-height:1.5}

#loading{position:absolute;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#loading.hidden{opacity:0;pointer-events:none}
#loading h2{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--accent2);margin-bottom:8px}
#loading p{font-size:14px;color:var(--text2)}
.loader{width:40px;height:40px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Quiz Mode ---------- */
#quiz-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
#quiz-btn:hover{background:var(--bg2);border-color:var(--accent)}
#quiz-btn.active{background:#8A4040;color:#fff;border-color:#8A4040;box-shadow:0 0 0 3px rgba(138,64,64,0.15)}
#quiz-btn .qdot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .2s}
#quiz-btn.active .qdot{background:#fff;animation:quizPulse 1.6s infinite}
@keyframes quizPulse{0%,100%{opacity:1}50%{opacity:0.45}}

#quiz-banner{display:none;position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(60,30,30,0.92);color:#FFE8D8;backdrop-filter:blur(12px);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:500;letter-spacing:0.3px;box-shadow:0 2px 20px rgba(0,0,0,0.16)}
#quiz-banner.visible{display:block}

#quiz-tracker{display:none;position:absolute;top:120px;right:16px;z-index:1001;background:rgba(238,242,232,0.95);backdrop-filter:blur(12px);border:1px solid var(--bg3);border-radius:10px;padding:8px 14px;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text);box-shadow:0 2px 14px rgba(0,0,0,0.08);min-width:120px;text-align:center}
/* v1.18: overlay toggles (top-right control group above the quiz tracker) */
#overlay-toggles{position:absolute;top:16px;right:16px;z-index:1001;display:flex;flex-direction:column;gap:6px;background:rgba(238,242,232,0.95);backdrop-filter:blur(12px);border:1px solid var(--bg3);border-radius:10px;padding:8px;box-shadow:0 2px 14px rgba(0,0,0,0.08)}
#overlay-toggles .ovt-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:600;text-align:center;margin-bottom:2px}
.ovt-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;min-width:140px}
.ovt-btn:hover{background:var(--bg2)}
.ovt-btn .ovt-swatch{width:14px;height:10px;border-radius:2px;border:1px solid var(--bg3);flex-shrink:0}
.ovt-btn .ovt-name{flex:1;text-align:left}
.ovt-btn .ovt-check{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bg3);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.ovt-btn.on{background:var(--bg2);color:var(--text);border-color:var(--accent)}
.ovt-btn.on .ovt-check{background:var(--accent);border-color:var(--accent);color:#fff}
.ovt-btn.on .ovt-check::after{content:'\2713'}
/* Hatched swatch (for peoples toggle) — diagonal stripe pattern via CSS gradient */
.ovt-swatch.hatched{background:repeating-linear-gradient(45deg,#FFFFFF 0px,#FFFFFF 3px,#3A3A3A 3px,#3A3A3A 5px);border:1px solid #6A6A6A}
/* Dashed swatch (for routes toggle) */
.ovt-swatch.dashed{background:transparent;border:none;height:0;border-top:3px dashed #8A4040;border-radius:0;margin-top:4px}
body.quiz-mode #quiz-tracker{display:block}
body.quiz-mode #side-panel.open ~ #quiz-tracker, body.quiz-mode #quiz-tracker{}
#quiz-tracker .qt-row{display:flex;align-items:center;justify-content:center;gap:6px}
#quiz-tracker .qt-aced{color:#1F5530;font-weight:700;font-variant-numeric:tabular-nums}
#quiz-tracker .qt-total{color:var(--text3)}
#quiz-tracker .qt-missed{display:block;font-size:10px;color:#7A1A1A;font-weight:600;margin-top:2px;letter-spacing:0.4px;text-transform:uppercase}
#quiz-tracker .qt-missed.empty{display:none}

/* The quiz panel reuses #side-panel; these styles theme its quiz content */
.quiz-pane{display:flex;flex-direction:column;gap:14px}
.quiz-progress{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-bottom:4px}
.quiz-progress .bar{height:100%;background:linear-gradient(90deg,#8A4040,#C26060);transition:width .35s ease}
.quiz-step-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:600}
.quiz-step-meta .level-tag{background:#8A4040;color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;letter-spacing:1px}
.quiz-prompt{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.35;color:var(--text);margin:8px 0 4px}
.quiz-sub{font-size:12px;color:var(--text2);margin-top:-2px}
.quiz-input-row{display:flex;align-items:center;gap:8px}
#quiz-answer{flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid var(--bg3);background:#fff;font-family:var(--sans);font-size:14px;color:var(--text);outline:none;transition:border-color .15s}
#quiz-answer:focus{border-color:var(--accent)}
#quiz-submit{padding:10px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;width:100%}
#quiz-submit:hover{background:var(--accent2)}
#quiz-submit.next{background:#8A4040}
#quiz-submit.next:hover{background:#6E3232}

.quiz-feedback{padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.visible{display:block}
.quiz-feedback.ok{background:#DDEBD8;border:1px solid #88B898;color:#2F5A35}
.quiz-feedback.bad{background:#F0DAD8;border:1px solid #C28080;color:#7A2828}
.quiz-feedback strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px}

.quiz-trail{border-top:1px solid var(--bg3);padding-top:12px;margin-top:4px}
.quiz-trail h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:600;margin-bottom:8px}
.quiz-trail ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.quiz-trail li{font-size:13px;color:var(--text);display:flex;align-items:flex-start;gap:8px}
.quiz-trail li .check{flex-shrink:0;width:16px;height:16px;border-radius:50%;background:#3A7A4A;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;margin-top:1px}
.quiz-trail li .lbl{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-right:4px;font-weight:600}

.quiz-done{text-align:center;padding:20px 12px;background:linear-gradient(180deg,#DDEBD8,#EEF2E8);border-radius:10px;border:1px solid #88B898}
.quiz-done h2{font-family:var(--serif);font-size:22px;color:#2F5A35;margin-bottom:6px}
.quiz-done p{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.quiz-done .pickanother{font-size:12px;color:var(--text3);font-style:italic}

/* Hide ALL leaflet tooltips when quiz mode is on (no country names visible on hover) */
body.quiz-mode .leaflet-tooltip,
body.quiz-mode .leaflet-tooltip-pane,
body.quiz-mode .country-tooltip{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
.country-tooltip{font-family:var(--sans)!important;background:rgba(238,242,232,0.95)!important;color:var(--text)!important;border:1px solid var(--bg3)!important;border-radius:6px!important;font-size:12px!important;padding:3px 8px!important;box-shadow:0 2px 8px rgba(0,0,0,0.1)!important}

/* v1.19: capital star markers + toggle swatch */
.ovt-swatch.capstar{background:transparent;border:none;font-size:12px;line-height:10px;color:#8A4040;text-align:center}
.cap-marker{font-size:13px;color:#5A2E2E;text-shadow:0 0 4px rgba(255,255,255,0.95),0 0 8px rgba(255,255,255,0.8);white-space:nowrap;transform:translate(-6px,-9px);pointer-events:none;font-family:var(--sans)}
.cap-marker .cap-name{font-size:10px;font-weight:600;margin-left:3px;letter-spacing:0.5px;color:#4A2424;vertical-align:1px}
.cap-marker .cap-name.zoomgate{display:none}
body.show-cap-names .cap-marker .cap-name.zoomgate{display:inline}
.ovt-swatch.disp{background:repeating-linear-gradient(-45deg,rgba(176,48,48,0.15) 0px,rgba(176,48,48,0.15) 3px,#8A2020 3px,#8A2020 5px);border:1px solid #8A2020}
/* v1.22: guided quiz UI */
.guided-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.guided-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;width:100%}
.guided-item:hover{background:var(--bg2);border-color:var(--accent)}
.guided-item.done{background:#DDEBD8;border-color:#88B898}
.guided-item .gi-name{flex:1}
.guided-item .gi-prog{font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap}
.guided-item.done .gi-prog{color:#2F5A35}
.guided-blurb{font-size:11px;color:var(--text3);font-weight:400;line-height:1.45;margin-top:3px}
.guided-crumb{font-size:11px;color:var(--text3);background:var(--bg2);border-radius:6px;padding:5px 9px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.guided-crumb a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
.guided-next{width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}
.guided-next:hover{filter:brightness(1.08)}
.guided-back{width:100%;padding:9px;border-radius:9px;border:1px solid var(--bg3);background:var(--bg);color:var(--text2);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;margin-top:8px}
.guided-back:hover{background:var(--bg2)}
.guided-headrow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.guided-headrow a{color:var(--accent);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
#quiz-banner .qsets{margin-left:8px;padding:2px 9px;border-radius:6px;border:1px solid rgba(255,232,216,0.4);background:transparent;color:#FFE8D8;font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer}
#quiz-banner .qsets:hover{background:rgba(255,232,216,0.15)}
/* v1.19: quiz level pills */
#quiz-banner .qlvl{display:inline-flex;gap:4px;margin:0 8px;vertical-align:middle}
#quiz-banner .qlvl button{padding:2px 9px;border-radius:6px;border:1px solid rgba(255,232,216,0.4);background:transparent;color:#FFE8D8;font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer}
#quiz-banner .qlvl button.on{background:#FFE8D8;color:#3C1E1E}
/* v1.20: compare overlay */
#compare-overlay{display:none;position:fixed;inset:0;z-index:4000;background:var(--bg)}
#compare-overlay.visible{display:flex;flex-direction:column}
#compare-head{display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(238,242,232,0.97);border-bottom:1px solid var(--bg3)}
#compare-head h2{font-family:var(--serif);font-size:17px;color:var(--text);margin-right:auto}
#compare-close{padding:6px 14px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}
#compare-close:hover{background:var(--bg2);border-color:var(--accent)}
#compare-panes{flex:1;display:flex;min-height:0}
.cmp-pane{flex:1;display:flex;flex-direction:column;min-width:0}
.cmp-pane+.cmp-pane{border-left:2px solid var(--bg3)}
.cmp-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(238,242,232,0.97);border-bottom:1px solid var(--bg3)}
.cmp-bar .cmp-year-label{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);min-width:88px;text-align:center}
.cmp-bar input{width:96px;padding:4px 8px;border-radius:6px;border:1px solid var(--bg3);background:var(--bg);font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);text-align:center;outline:none}
.cmp-bar button{padding:4px 10px;border-radius:6px;border:1px solid var(--bg3);background:var(--bg);font-size:13px;font-weight:700;color:var(--text2);cursor:pointer}
.cmp-bar button:hover{background:var(--bg2)}
.cmp-bar .cmp-count{font-size:11px;color:var(--text3);margin-left:auto}
.cmp-map{flex:1;min-height:0}
@media(max-width:768px){#compare-panes{flex-direction:column}.cmp-pane+.cmp-pane{border-left:none;border-top:2px solid var(--bg3)}.cmp-bar input{width:70px}}
/* v1.21: mobile pass — compact single-row topbar, bottom-sheet panel, 44px touch
 * targets, collapsible legend + overlay controls, repositioned quiz banner/tracker. */
.coll-chev{display:inline-block;margin-left:6px;font-size:9px;transition:transform .2s}
#legend.collapsed .coll-chev,#overlay-toggles.collapsed .coll-chev{transform:rotate(-90deg)}
#legend h4,.ovt-label{cursor:pointer;user-select:none}
#legend.collapsed #legend-items{display:none}
#overlay-toggles.collapsed .ovt-btn{display:none}
#legend.collapsed,#overlay-toggles.collapsed{opacity:0.92}
@media(max-width:768px){
  :root{--panel-w:100%}
  /* Topbar: one compact row, search takes remaining width */
  #topbar{left:8px;right:8px;transform:none;padding:6px 8px;gap:8px;flex-wrap:nowrap}
  #topbar h1{font-size:14px}
  #topbar .sep{display:none}
  #search-box{flex:1;min-width:0;padding:4px 8px}
  #search-input{width:100%;min-width:0;font-size:16px} /* 16px prevents iOS zoom-on-focus */
  #compare-btn,#quiz-btn{padding:8px 10px;font-size:11px;white-space:nowrap}
  /* Timeline: bigger touch targets */
  #timeline{padding:8px 10px 12px}
  #timeline-inner{gap:8px}
  #year-display{font-size:15px;min-width:62px}
  #play-btn{width:44px;height:44px}
  #year-slider{height:8px}
  #year-slider::-webkit-slider-thumb{width:28px;height:28px}
  #year-slider::-moz-range-thumb{width:28px;height:28px}
  #year-input{width:62px;padding:8px 6px}
  #era-markers span{font-size:8px}
  #era-markers span:nth-child(even){display:none} /* fewer tick labels on narrow screens */
  /* Side panel becomes a bottom sheet: map stays visible above it */
  #side-panel{top:auto;bottom:0;left:0;right:0;width:100%;height:auto;max-height:62vh;border-left:none;border-top:1px solid var(--bg3);border-radius:16px 16px 0 0;transform:translateY(105%);box-shadow:0 -8px 30px rgba(0,0,0,0.15)}
  #side-panel.open{transform:translateY(0)}
  #panel-header{padding:12px 16px 10px;position:sticky;top:0;background:rgba(238,242,232,0.98);border-radius:16px 16px 0 0}
  #panel-body{padding:12px 16px 28px}
  #panel-close{padding:8px}
  /* Quiz banner tucks under the topbar */
  #quiz-banner{top:60px;bottom:auto;font-size:11px;padding:6px 10px;white-space:nowrap;max-width:calc(100% - 16px)}
  #quiz-banner .qlvl button{padding:4px 10px}
  /* Control groups: tighter, collapsible (start collapsed via JS) */
  #overlay-toggles{top:60px;right:8px;padding:6px;max-width:46vw}
  body.quiz-mode #overlay-toggles{top:104px}
  #overlay-toggles .ovt-btn{min-width:120px;padding:8px 8px;font-size:11px}
  #quiz-tracker{top:auto;bottom:118px;right:8px;padding:6px 10px;font-size:11px;min-width:96px}
  #legend{bottom:112px;left:8px;max-width:46vw;padding:8px 10px;max-height:32vh;overflow-y:auto}
}
/* v1.23: mobile quiz redesign — during a question the sheet stays short so the
   highlighted country remains visible above it; the answer trail is hidden
   (progress lives in the step counter + bar), and paddings tighten. */
@media(max-width:768px){
  body.quiz-mode #side-panel:has(#quiz-answer){max-height:38vh}
  body.quiz-mode #side-panel:has(#quiz-answer) .quiz-trail{display:none}
  body.quiz-mode #side-panel:has(#quiz-answer) #panel-header{padding:8px 16px 6px}
  body.quiz-mode #side-panel:has(#quiz-answer) #panel-body{padding:8px 16px 14px}
  body.quiz-mode #side-panel:has(#quiz-answer) .quiz-prompt{font-size:14px;margin:6px 0 4px}
  body.quiz-mode #side-panel:has(#quiz-answer) .quiz-step-meta{margin-bottom:4px}
  body.quiz-mode #side-panel:has(#quiz-answer) .guided-crumb{margin-bottom:6px;padding:4px 8px}
  body.quiz-mode #side-panel:has(#quiz-answer) #quiz-submit{padding:10px;margin-top:6px}
  body.quiz-mode #side-panel:has(#quiz-answer) .quiz-progress{margin-bottom:4px}
}

    <div class="qt-missed empty">0 missed</div>
  </div>
  <div id="compare-overlay" aria-label="Compare eras">
    <div id="compare-head"><h2>Compare eras</h2><button id="compare-close" onclick="toggleCompare()">&#10005; Close</button></div>
    <div id="compare-panes">
      <div class="cmp-pane">
        <div class="cmp-bar"><button onclick="cmpStep(0,-1)" title="Previous snapshot">&lsaquo;</button><span class="cmp-year-label" id="cmp-label-0">&mdash;</span><button onclick="cmpStep(0,1)" title="Next snapshot">&rsaquo;</button><input id="cmp-input-0" placeholder="e.g. 500 BCE"><span class="cmp-count" id="cmp-count-0"></span></div>
        <div class="cmp-map" id="cmp-map-0"></div>
      </div>
      <div class="cmp-pane">
        <div class="cmp-bar"><button onclick="cmpStep(1,-1)" title="Previous snapshot">&lsaquo;</button><span class="cmp-year-label" id="cmp-label-1">&mdash;</span><button onclick="cmpStep(1,1)" title="Next snapshot">&rsaquo;</button><input id="cmp-input-1" placeholder="e.g. 1500 CE"><span class="cmp-count" id="cmp-count-1"></span></div>
        <div class="cmp-map" id="cmp-map-1"></div>
      </div>
    </div>
  </div>
  <div id="timeline"><div id="timeline-inner">
    <button id="play-btn" onclick="togglePlay()"><svg id="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></button>
    <div id="year-display">3000 BCE</div>
    <div id="slider-wrap">

    </div>
    <div id="year-input-wrap">
      <input id="year-input" type="text" value="3000">

    </div>
  </div></div>

    </div>
    <div id="panel-body"></div>
  </div>
</div>

f_Carrhae"]}},{"name":"Han Dynasty (Western Han, late)","c":{"f":"#D4B870","s":"#947830"},"coords":[[44,76],[43,84],[42,92],[41.5,100],[41,108],[40,114],[38,118],[35.5,119.5],[33,120.5],[31,121.5],[29,120],[27,117],[24.5,112],[23,107.5],[22.5,104],[23.5,100.5],[25,96.5],[27.5,92.5],[30,89],[33,85.5],[36,81],[39,78],[41.5,76.5]],"info":{"capital":"Chang'an","pop":"~60 million","synopsis":"The late Western Han Dynasty under Emperor Ai. The empire stretches from Korea to Vietnam, from the Tarim Basin to the South China Sea. The Silk Road, opened by Han envoys to Central Asia under Wu Di a century earlier, links Han China to Parthia and indirectly to Rome. Paper-making, the seismograph, the wheelbarrow, and a centralized civil-service bureaucracy are all Han innovations. The Wang Mang interregnum (9-23 CE) will briefly interrupt Han rule. (Source: Snow 2018, pp.82-83)","links":["https://en.wikipedia.org/wiki/Han_dynasty","https://en.wikipedia.org/wiki/Silk_Road"]}},{"name":"Yuezhi (proto-Kushan)","c":{"f":"#9AB87A","s":"#5A8A3A"},"coords":[[40,64],[38.5,68],[37,71],[35,73],[33,74],[31,73.5],[29.5,71.5],[28.5,68.5],[28.5,66],[30,63.5],[33,62],[36,62.5],[38.5,63]],"info":{"capital":"Bactra (Balkh)","pop":"~3 million","synopsis":"The Yuezhi are a confederation of Central Asian peoples (originally from the Tarim/Gansu corridor) who migrated west under pressure from the Xiongnu. They have settled in former Greco-Bactria. Around 30-50 CE, the Kushan branch of the Yuezhi will unite the confederation under Kujula Kadphises and establish the Kushan Empire, which will dominate Silk Road trade and patronize Buddhism.","links":["https://en.wikipedia.org/wiki/Yuezhi","https://en.wikipedia.org/wiki/Kushan_Empire"]}},{"name":"Indian states (post-Maurya)","c":{"f":"#D89060","s":"#985020"},"coords":[[28,73],[27,77],[25.5,80.5],[23.5,83],[20.5,84.5],[18,83],[16,80],[14,78],[12.5,75.5],[11.5,75],[12.5,73.5],[15,72.5],[18,72.5],[21,72],[24,71.5],[26.5,72]],"info":{"capital":"Various (Pataliputra, Pratishthana, Vidisha)","pop":"~70 million","synopsis":"India is fragmented after the collapse of the Mauryan Empire (185 BCE) and its successor Sunga and Kanva dynasties. The Satavahana dynasty rules the Deccan from Pratishthana. Indo-Scythians (Sakas) and Indo-Parthians control the northwest. Tamil kingdoms (Chola, Chera, Pandya) flourish in the deep south, trading with Roman Egypt for spices and gems. The Periplus of the Erythraean Sea, a Greek merchant's guide composed mid-1st century CE, attests to dense Indo-Roman trade.","links":["https://en.wikipedia.org/wiki/Satavahana_dynasty","https://en.wikipedia.org/wiki/Sunga_Empire"]}},{"name":"Aksum (early)","c":{"f":"#9C7050","s":"#5A4028"},"coords":[[18,38.5],[17,39.5],[15.5,40.5],[14,41],[12.5,41.5],[12,40],[12.5,38.5],[14,37.5],[15.5,37],[17,37.5]],"info":{"capital":"Aksum","pop":"~1 million","synopsis":"The Kingdom of Aksum has emerged in the Ethiopian highlands and Eritrean coast. Aksumite merchants control Red Sea trade between Rome and the Indian Ocean: ivory, gold, frankincense, spices, and silk pass through the port of Adulis. Within two centuries, Aksum will become one of the four great powers of the ancient world (alongside Rome, Persia, and Han China) per the 3rd-century Persian prophet Mani.","links":["https://en.wikipedia.org/wiki/Kingdom_of_Aksum"]}},{"name":"Teotihuacán (rising)","c":{"f":"#88A878","s":"#487048"},"coords":[[20.5,-100],[20.5,-98],[19.5,-97.5],[18.5,-98],[18.5,-99.5],[19.5,-100.5]],"info":{"capital":"Teotihuacán","pop":"~unknown (city growing)","synopsis":"In the Valley of Mexico, Teotihuacán is rising from a small settlement (founded c.150 BCE) into a planned city. The Pyramid of the Sun and the Pyramid of the Moon are under construction; the Avenue of the Dead is being laid out. By 200 CE, Teotihuacán will be one of the largest cities on Earth, with perhaps 100,000 inhabitants. Its founders' identity remains debated; the city's influence will radiate across Mesoamerica. (Source: Snow 2018, pp.78-79)","links":["https://en.wikipedia.org/wiki/Teotihuacan"]}},{"name":"Maya (Late Preclassic)","c":{"f":"#A0B870","s":"#608030"},"coords":[[21.5,-91],[21.5,-87.5],[20,-86.8],[18,-87.5],[16,-88.5],[14.5,-89.5],[13.5,-90.5],[14.5,-92],[16.5,-92],[18,-91.5],[19.5,-91]],"info":{"capital":"El Mirador, Nakbe, Calakmul (early)","pop":"~5 million (broad area)","synopsis":"The Maya Late Preclassic period (400 BCE-250 CE) is the era of the first great Maya cities. El Mirador in the Petén jungle of modern Guatemala has built the largest pyramid by volume in the ancient Americas (La Danta, ~2.8 million cubic meters). Hieroglyphic writing, the Long Count calendar, and complex political hierarchies are emerging. The Classic period collapse of El Mirador around 150 CE will shift Maya power south to Tikal and other centers. (Source: Snow 2018, pp.78-79)","links":["https://en.wikipedia.org/wiki/Maya_civilization","https://en.wikipedia.org/wiki/El_Mirador"]}},{"name":"Zapotec at Monte Albán","c":{"f":"#B0A060","s":"#605830"},"coords":[[17.5,-97.5],[17.5,-95.5],[16.5,-94.5],[15.5,-95],[15.5,-96.5],[16,-97.5],[17,-97.7]],"info":{"capital":"Monte Albán","pop":"~250,000","synopsis":"The Zapotec capital of Monte Albán dominates the Valley of Oaxaca and is expanding its political reach. Zapotec hieroglyphic writing remains the oldest in Mesoamerica. Monte Albán will reach its peak around 200-700 CE before declining. (Source: Snow 2018, pp.78-79)","links":["https://en.wikipedia.org/wiki/Monte_Alb%C3%A1n"]}},{"name":"Moche (proto)","c":{"f":"#B07840","s":"#684020"},"coords":[[-5.5,-81],[-6.5,-80],[-7.5,-79.5],[-8.5,-79],[-9,-78],[-8,-77],[-6.5,-77.5],[-5.5,-79.5]],"info":{"capital":"Cerro Blanco (later Pampa Grande)","pop":"~100,000 (early)","synopsis":"The Moche culture is forming on the north coast of Peru, building on Cupisnique and Salinar predecessors. Moche civilization will reach its peak between 100 and 700 CE, building large adobe temple-pyramids (huacas), constructing sophisticated irrigation, and producing some of the most expressive figurative ceramics in the ancient Americas, including portrait vessels and erotic art.","links":["https://en.wikipedia.org/wiki/Moche_culture"]}},{"name":"Yayoi Japan","c":{"f":"#D8B098","s":"#7A5C42"},"coords":[[34,131.5],[34.5,133],[35.5,134.5],[35.5,136.5],[35,137.5],[34.5,137],[33.5,134.5],[33.5,132.5]],"info":{"capital":"(no centralized state; confederations of Wa)","pop":"~1-2 million","synopsis":"The Yayoi culture (c.300 BCE-300 CE) has transformed Japan from the hunter-gatherer Jomon to a society of wet-rice agriculture, bronze and iron metallurgy, and increasing political stratification. Chinese chronicles refer to the islands as \"Wa,\" a patchwork of perhaps a hundred small chiefdoms. Within two centuries, Queen Himiko of Yamatai will be the first named ruler in Japanese history.","links":["https://en.wikipedia.org/wiki/Yayoi_period"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Eurasian steppe nomads (pre-Mongol)","c":{"f":"#A8A8A8","s":"#404040"},"coords":[[52,30],[55,80],[52,115],[44,110],[40,80],[44,42],[48,32],[52,30]],"peoples":true,"info":{"region":"Eurasian steppe — Pannonia to Mongolia","lifeway":"Pastoral nomads (horses, sheep); mounted archers","languages":"Various Turkic, Mongolic, Indo-Iranian (Scythian, Sarmatian, Sogdian) languages","synopsis":"The Eurasian steppe was home to a succession of nomadic confederations — Scythians, Xiongnu, Huns, Avars, Göktürks, Uyghurs, Khazars, and many more — none of which fit the conventional definition of states but all of which projected periodic devastating power against sedentary empires from Han China to Rome to Sassanid Persia. The Mongols of 1206 were the culmination of this two-millennia tradition.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}},{"name":"Andean / pre-state highland peoples","c":{"f":"#B89070","s":"#604018"},"coords":[[10,-78],[5,-74],[-10,-75],[-22,-65],[-22,-72],[-13,-78],[-3,-80],[5,-78],[10,-78]],"peoples":true,"info":{"region":"Andean cordillera and Pacific coast — modern Peru, Bolivia, Ecuador","lifeway":"Vertical-ecology farmers (potato, maize, quinoa); llama/alpaca pastoralists","languages":"Proto-Quechua; Aymara; Mochica; many others","synopsis":"Long before the Inca synthesis, the Andes were home to many highland and coastal polities and peoples — Chavín, Paracas, Wari, Tiwanaku, Moche, Nazca, and countless smaller groups. Most were not states in any centralized sense but managed sophisticated vertical-ecology systems (controlling agricultural zones from coast to highlands).","links":[]}}],"100":[{"name":"Roman Empire (Nerva / Trajan rising)","c":{"f":"#D4A0A0","s":"#9A4A4A"},"coords":[[55,-10],[55,8],[48,8],[44,10],[42,18],[44,28],[40,40],[34,38],[31,32],[30,15],[34,2],[36,-6],[40,-9],[44,-9],[55,-10]],"info":{"capital":"Rome","pop":"55-65 million","synopsis":"Nerva (96-98 CE) had just adopted Trajan, who would expand the Roman Empire to its greatest territorial extent (Dacia, Mesopotamia, Armenia). The Pax Romana was at its height. Rome held a quarter of humanity (Source: Snow 2018, p n cordillera and Pacific coast — modern Peru, Bolivia, Ecuador","lifeway":"Vertical-ecology farmers (potato, maize, quinoa); llama/alpaca pastoralists","languages":"Proto-Quechua; Aymara; Mochica; many others","synopsis":"Long before the Inca synthesis, the Andes were home to many highland and coastal polities and peoples — Chavín, Paracas, Wari, Tiwanaku, Moche, Nazca, and countless smaller groups. Most were not states in any centralized sense but managed sophisticated vertical-ecology systems (controlling agricultural zones from coast to highlands).","links":[]}}],"300":[{"name":"Roman Empire (Diocletian Tetrarchy)","c":{"f":"#D4A0A0","s":"#9A4A4A"},"coords":[[55.5,-5],[55,-1],[53,2],[51,5],[50,7.5],[49,12],[48,16],[47,19],[45.5,21],[44,24],[43.5,28],[42,33],[41,37],[38.5,40.5],[37,38.5],[35.5,36.5],[34,35.5],[32.5,34],[31,32],[30.5,31],[28.5,30],[26,30],[23.5,30.5],[21.5,31.5],[19.5,30],[20,26],[22,22],[27,15],[31,11],[33,9.5],[34.5,7],[36,2],[36.5,-2],[37,-5],[38,-9],[40,-9.5],[42.5,-9],[44,-8],[46.5,-3],[48.5,-3],[50.5,-4.5],[53,-3.5],[55,-4.5]],"info":{"capital":"Four capitals (Tetrarchy): Nicomedia, Sirmium, Milan, Trier","pop":"~55 million","synopsis":"Diocletian (r.284-305 CE) has rescued the empire from the Crisis of the Third Century by splitting governance into four. Two Augusti and two Caesars rule the four prefectures. Britain, Dacia (now lost), Gaul, Iberia, North Africa, Egypt, the Levant, Anatolia, and the Balkans are all Roman. Constantine's rise (306 CE), the Edict of Milan tolerating Christianity (313 CE), and the founding of Constantinople (330 CE) are all just ahead. (Source: Snow 2018, pp.86-87)","links":["https://en.wikipedia.org/wiki/Diocletian","https://en.wikipedia.org/wiki/Tetrarchy"]}},{"name":"Sassanid Empire (early)","c":{"f":"#D4C490","s":"#8A7A30"},"coords":[[40,42],[39.5,46.5],[38.5,51],[37.5,55.5],[36.5,59.5],[34,62],[31.5,62.5],[29,60.5],[26.5,57],[25.5,53],[26,49.5],[27.5,46.5],[29.5,44],[31.5,42.5],[34.5,41],[37,41],[39,41.5]],"info":{"capital":"Ctesiphon","pop":"~12 million","synopsis":"The Sassanid Empire, founded in 224 CE when Ardashir I overthrew the Parthians, has consolidated as Rome's great rival. Shapur I famously captured the Roman emperor Valerian alive in 260 CE. The Zoroastrian state religion is being formalized; Mani has just founded Manichaeism (executed 274 CE). Khosrow I's 6th-century reforms and Khosrow II's wars with Byzantium are still centuries ahead.","links":["https://en.wikipedia.org/wiki/Sasanian_Empire","https://en.wikipedia.org/wiki/Shapur_I"]}},{"name":"Western Jin Dynasty","c":{"f":"#D4B870","s":"#947830"},"coords":[[44,76],[43,84],[42,92],[41.5,100],[41,108],[40,114],[38,118],[35.5,119.5],[33,120.5],[31,121.5],[29,120],[27,117],[24.5,112],[23,107.5],[22.5,104],[24,100.5],[26.5,96],[29.5,92],[33,88],[36,82],[39,78],[41.5,76.5]],"info":{"capital":"Luoyang","pop":"~50 million","synopsis":"After the Three Kingdoms period (220-280 CE), the Western Jin briefly reunified China under Sima Yan in 280 CE. The unity is fragile: the War of the Eight Princes (291-306 CE) is tearing the imperial family apart, and northern nomadic peoples (Xiongnu, Xianbei) are pressing the frontiers. By 316 CE the north will be lost; the dynasty will retreat south as the Eastern Jin, beginning the long division that will not end until the Sui in 589 CE. (Source: Snow 2018, pp.82-83 context)","links":["https://en.wikipedia.org/wiki/Western_Jin","https://en.wikipedia.org/wiki/Three_Kingdoms"]}},{"name":"Late Kushan","c":{"f":"#9AB87A","s":"#5A8A3A"},"coords":[[40,64],[38.5,68],[37,71],[35,73.5],[33,75],[31,75],[28.5,72],[27,68.5],[28,65],[31,63],[34,62.5],[37,63]],"info":{"capital":"Peshawar (Purushapura)","pop":"~5 million (declining)","synopsis":"The Kushan Empire, the great Buddhist patrons of the Silk Road, is fragmenting under Sassanid pressure from the west and pressure from steppe peoples from the north. The Kushano-Sasanians (Kushanshahs) rule the western half as Sassanid vassals. Gandharan art continues to flourish; the standing Buddha image, with its Hellenistic robes, is a Kushan invention.","links":["https://en.wikipedia.org/wiki/Kushan_Empire","https://en.wikipedia.org/wiki/Gandhara"]}},{"name":"Kingdom of Aksum","c":{"f":"#9C7050","s":"#5A4028"},"coords":[[18,37.5],[17.5,40],[16.5,42],[14.5,43],[12.5,43],[11,42],[10.5,40],[11.5,38.5],[13,37],[15,36.5],[17,37]],"info":{"capital":"Aksum","pop":"~3 million","synopsis":"Aksum is at its monumental peak. Massive carved granite stelae (some over 30 m tall, the tallest single pieces of stone ever erected as monuments by humans) are being raised as royal funerary markers. Aksum trades with Rome, Sassanid Persia, India, and Sri Lanka through the port of Adulis. Within 30 years, King Ezana will convert the kingdom to Christianity (c.330 CE), making Aksum one of the earliest Christian polities.","links":["https://en.wikipedia.org/wiki/Kingdom_of_Aksum"]}},{"name":"Teotihuacán (peak)","c":{"f":"#88A878","s":"#487048"},"coords":[[21,-100.5],[21,-97.5],[20,-96.5],[18.5,-96.5],[17,-97.5],[17,-100],[18.5,-101],[20,-101]],"info":{"capital":"Teotihuacán","pop":"~125,000 (city)","synopsis":"Teotihuacán is the largest city in the Americas and one of the largest in the world: roughly 8 km², with grid-planned multifamily apartment compounds housing ethnically diverse populations. The Pyramid of the Sun, the Pyramid of the Moon, and the Temple of the Feathered Serpent all dominate the Avenue of the Dead. Teotihuacán's influence reaches as far as the Maya cities of Tikal and Copán. (Source: Snow 2018, pp.78-79)","links":["https://en.wikipedia.org/wiki/Teotihuacan"]}},{"name":"Maya (Early Classic)","c":{"f":"#A0B870","s":"#608030"},"coords":[[21.5,-91],[21.5,-87.5],[20,-86.8],[18,-87.5],[16,-88.5],[14.5,-89.5],[13.5,-90.5],[14.5,-92],[16.5,-92],[18,-91.5],[19.5,-91]],"info":{"capital":"Tikal, Calakmul, Caracol, Copán, Palenque","pop":"~5-10 million","synopsis":"The Maya Classic period (250-900 CE) has begun. Indepe
