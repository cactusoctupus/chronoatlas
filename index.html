inear B writing disappears; literacy will not return to Greece for 400 years (the \"Greek Dark Age\"). The cause remains debated: invasion, internal revolt, climate stress, or all of these. (Source: Snow 2018, pp.42-43)","links":["https://en.wikipedia.org/wiki/Late_Bronze_Age_collapse","https://en.wikipedia.org/wiki/Mycenaean_Greece"]}},{"name":"Middle Assyrian Empire","c":{"f":"#B87858","s":"#784830"},"coords":[[38,38],[37.5,40.5],[37,43],[36,45],[35,45.5],[33.5,45],[33.5,42.5],[34.5,40.5],[35.5,38.5],[36.5,37.5],[37.5,37.5]],"info":{"capital":"Ashur","pop":"~1.5 million","synopsis":"Assyria has emerged as a major power in upper Mesopotamia, peaking under Tukulti-Ninurta I (r.1233-1197 BCE) who briefly captured Babylon. Assyria adopts iron weapons and armor early. After a period of contraction, the Middle Assyrian state is the seedbed of the later Neo-Assyrian Empire that will dominate the Near East from 911 BCE.","links":["https://en.wikipedia.org/wiki/Middle_Assyrian_Empire","https://en.wikipedia.org/wiki/Tukulti-Ninurta_I"]}},{"name":"Babylonia (Late Kassite)","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[34,42.5],[33.5,44.5],[33,46],[32,47],[30.5,48],[29.6,48.2],[30,47],[30.7,45.5],[31.7,43.8],[32.8,42.5]],"info":{"capital":"Babylon","pop":"~2 million","synopsis":"The Kassite dynasty has ruled Babylon for nearly four centuries but is weakening. After 1200 BCE, Elamite and Assyrian incursions will end Kassite rule (c.1155 BCE). Babylon nonetheless retains its prestige as a center of Akkadian-language scholarship, omen literature, and astronomy.","links":["https://en.wikipedia.org/wiki/Kassite_dynasty"]}},{"name":"Late Shang Dynasty","c":{"f":"#D4A060","s":"#947030"},"coords":[[37,112.5],[36.5,114],[35.8,115.5],[34.5,116.5],[33,116.5],[32,115],[32,113.5],[33,112],[34.5,110.8],[36,111],[36.7,112]],"info":{"capital":"Yin (Anyang)","pop":"~5 million","synopsis":"The Shang Dynasty has reached its mature stage with its capital at Anyang (Yin) since c.1300 BCE. Vast royal cemeteries, sophisticated bronze ritual vessels, and tens of thousands of oracle bones survive. The vassal Zhou state in the west is growing in power; in 1046 BCE Zhou forces under King Wu will defeat the Shang at the Battle of Muye and end the dynasty. (Source: Snow 2018, pp.40-41)","links":["https://en.wikipedia.org/wiki/Shang_dynasty"]}},{"name":"Olmec (San Lorenzo phase)","c":{"f":"#A87858","s":"#583828"},"coords":[[18.5,-95.5],[18.5,-93.5],[18,-92.5],[17.5,-91.5],[17,-91.8],[16.5,-92.8],[16.5,-94],[17,-95.5],[18,-95.8]],"info":{"capital":"San Lorenzo Tenochtitlan","pop":"~250,000","synopsis":"The Olmec, \"mother culture\" of Mesoamerica, is centered on San Lorenzo in the Gulf Coast lowlands of modern Veracruz and Tabasco. Massive basalt heads (some weighing over 20 tonnes) are being carved and transported. Olmec artistic and religious motifs (the were-jaguar, the feathered serpent prototype) will diffuse across Mesoamerica for the next 2,000 years. (Source: Snow 2018, pp.52-53)","links":["https://en.wikipedia.org/wiki/Olmecs","https://en.wikipedia.org/wiki/San_Lorenzo_Tenochtitl%C3%A1n"]}},{"name":"Chavín (early)","c":{"f":"#88B898","s":"#3A7A4A"},"coords":[[-8,-78],[-8,-76],[-10,-77],[-10,-78]],"info":{"capital":"Chavín de Huántar (forming)","pop":"0.1-0.2 million","synopsis":"The Chavín cult complex in the northern Peruvian highlands was emerging around 1200 BCE as the first pan-Andean religious tradition, a precursor to the later Chavín horizon (peak c.900-200 BCE). Its serpent-jaguar-eagle iconography would spread across the Andes.","links":[]}},{"name":"Vedic India (Rigvedic)","c":{"f":"#D4A060","s":"#947030"},"coords":[[34,72],[34,80],[26,80],[26,72]],"info":{"capital":"Saptasindhu (the Land of Seven Rivers)","pop":"5-7 million","synopsis":"The Vedic civilization of Indo-Aryan-speaking pastoralists was composing the hymns of the Rigveda in the Punjab region. Cattle wealth, soma rituals, and chariot warriors defined the period. The later Vedic period (1000-500 BCE) would see the eastward expansion into the Gangetic plain and the formation of the Mahajanapadas.","links":[]}},{"name":"Phoenician proto-cities","c":{"f":"#D8B098","s":"#7A5C42"},"coords":[[35,34],[36,36],[33,36],[33,34]],"info":{"capital":"Byblos / Sidon / Tyre (forming)","pop":"0.2-0.4 million","synopsis":"The Bronze Age Levantine ports of Byblos, Sidon, and Tyre — at this date still semi-tributary to Egypt or the collapsing Hittite Empire — were laying the foundations of the Phoenician civilization that would dominate Mediterranean trade by 800 BCE. The Phoenician alphabet, ancestor of all Western alphabets, was incubating here.","links":[]}},{"name":"Kingdom of Kush (forming)","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[24,30],[24,36],[16,36],[16,30]],"info":{"capital":"Kerma (early) / Napata (later)","pop":"0.5-1 million","synopsis":"The Kingdom of Kush of Nubia, south of Egypt along the Nile, was emerging as a distinct civilization. It had its own pharaohs, pyramids, hieroglyph-derived script, and would briefly conquer Egypt as the 25th Dynasty (Black Pharaohs) around 750-650 BCE.","links":[]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Eurasian steppe nomads (pre-Mongol)","c":{"f":"#A8A8A8","s":"#404040"},"coords":[[52,30],[55,80],[52,115],[44,110],[40,80],[44,42],[48,32],[52,30]],"peoples":true,"info":{"region":"Eurasian steppe — Pannonia to Mongolia","lifeway":"Pastoral nomads (horses, sheep); mounted archers","languages":"Various Turkic, Mongolic, Indo-Iranian (Scythian, Sarmatian, Sogdian) languages","synopsis":"The Eurasian steppe was home to a succession of nomadic confederations — Scythians, Xiongnu, Huns, Avars, Göktürks, Uyghurs, Khazars, and many more — none of which fit the conventional definition of states but all of which projected periodic devastating power against sedentary empires from Han China to Rome to Sassanid Persia. The Mongols of 1206 were the culmination of this two-millennia tradition.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}},{"name":"Andean / pre-state highland peoples","c":{"f":"#B89070","s":"#604018"},"coords":[[10,-78],[5,-74],[-10,-75],[-22,-65],[-22,-72],[-13,-78],[-3,-80],[5,-78],[10,-78]],"peoples":true,"info":{"region":"Andean cordillera and Pacific coast — modern Peru, Bolivia, Ecuador","lifeway":"Vertical-ecology farmers (potato, maize, quinoa); llama/alpaca pastoralists","languages":"Proto-Quechua; Aymara; Mochica; many others","synopsis":"Long before the Inca synthesis, the Andes were home to many highland and coastal polities and peoples — Chavín, Paracas, Wari, Tiwanaku, Moche, Nazca, and countless smaller groups. Most were not states in any centralized sense but managed sophisticated vertical-ecology systems (controlling agricultural zones from coast to highlands).","links":[]}}],"-800":[{"name":"Neo-Assyrian Empire","c":{"f":"#B87858","s":"#784830"},"coords":[[38,36],[37.5,39],[37,42],[37,45],[36.5,47.5],[35.5,48.5],[33.5,48],[31.5,48],[30,48.5],[29.6,48],[30,46.5],[30.5,44.5],[31,42.5],[32,40.5],[33.5,38.5],[34.5,36.5],[35.5,35],[36.5,34.5],[37,35.5]],"info":{"capital":"Kalhu (Nimrud)","pop":"~6 million","synopsis":"The Neo-Assyrian Empire is in its expansionist phase under Adad-nirari III (r.811-783 BCE). Iron weapons, professional standing armies, siege warfare, and brutal mass deportation policies make Assyria the dominant power. The capital has moved from Ashur to Kalhu (Nimrud); under Sargon II it will move again to Khorsabad, then to Nineveh. By the 7th century BCE the empire will incorporate Egypt itself. (Source: Snow 2018, pp.48-49)","links":["https://en.wikipedia.org/wiki/Neo-Assyrian_Empire"]}},{"name":"Phoenician City-States","c":{"f":"#4A8088","s":"#1A4048"},"coords":[[35.2,35.5],[34.5,36],[33.5,35.5],[33,35.2],[33.5,34.5],[34.5,35],[35,35.3]],"info":{"capital":"Tyre (and Sidon, Byblos, Berytus)","pop":"~500,000 (homeland)","synopsis":"The Phoenician city-states of the Lebanese coast are at their commercial and maritime peak. Tyre, founded c.2750 BCE, dominates Mediterranean trade. The Phoenician alphabet, ancestor of Greek and Latin scripts, is being adopted by trading partners. Carthage was founded as a Tyrian colony in 814 BCE and will become a Mediterranean superpower in its own right. (Source: Snow 2018, pp.54-55)","links":["https://en.wikipedia.org/wiki/Phoenicia","https://en.wikipedia.org/wiki/Tyre,_Lebanon"]}},{"name":"Israel and Judah","c":{"f":"#C8B098","s":"#785838"},"coords":[[33.5,35.5],[33,36],[32,35.8],[31,35.5],[30.5,35],[31,34.5],[31.8,34.5],[32.5,34.8],[33.2,35]],"info":{"capital":"Samaria (Israel) and Jerusalem (Judah)","pop":"~600,000","synopsis":"After Solomon's death (c.930 BCE) the United Monarchy split. The Northern Kingdom of Israel (capital Samaria) is the larger and more prosperous; the Southern Kingdom of Judah (capital Jerusalem) is poorer but holds the Temple. The Hebrew Bible begins to take shape in this era. Both kingdoms will be destroyed by Assyria (Israel in 722 BCE) and Babylonia (Judah in 586 BCE). (Source: Snow 2018, pp.44-45)","links":["https://en.wikipedia.org/wiki/Kingdom_of_Israel_(Samaria)","https://en.wikipedia.org/wiki/Kingdom_of_Judah"]}},{"name":"Urartu","c":{"f":"#789078","s":"#385038"},"coords":[[40.5,42],[40.5,44.5],[39.5,46.5],[38,45.5],[37.5,43],[38,41.5],[39,41],[40,41.5]],"info":{"capital":"Tushpa (modern Van)","pop":"~1 million","synopsis":"Urartu is the kingdom around Lake Van in the Armenian highlands, a persistent rival of Assyria from the 9th to 6th centuries BCE. Urartian engineers built sophisticated fortresses, irrigation systems, and aqueducts. The kingdom collapsed in the early 6th century BCE under combined pressure from Cimmerians, Scythians, and the rising Medes; its territory became the early Armenian homeland.","links":["https://en.wikipedia.org/wiki/Urartu"]}},{"name":"Egypt (Third Intermediate)","c":{"f":"#C8A050","s":"#8A6A20"},"coords":[[31.5,29.8],[31.5,32.5],[30,33],[28,33.5],[26,34],[24,33.5],[22,32.5],[20.5,31.5],[20.5,30.5],[22,30],[24,30],[26,30],[29,29.8]],"info":{"capital":"Tanis (Lower Egypt) / Thebes (Upper Egypt)","pop":"~2.5 million","synopsis":"Egypt is fragmented in the Third Intermediate Period. The 22nd Dynasty (Libyan-descended) rules from Tanis in the delta; rival lines hold Thebes and other regional centers. Egypt's former imperial reach into the Levant is gone. The Kushite kingdom of Napata to the south will conquer all of Egypt by 747 BCE, founding the 25th \"Black Pharaohs\" Dynasty.","links":["https://en.wikipedia.org/wiki/Third_Intermediate_Period_of_Egypt"]}},{"name":"Eastern Zhou (Spring and Autumn period)","c":{"f":"#D4B870","s":"#947830"},"coords":[[40,107],[39.5,112],[38,116.5],[36,118.5],[33.5,119.5],[31,120],[28.5,118.5],[26.5,115],[25.5,111.5],[26,108],[27.5,105],[30,103],[33,103.5],[36,104.5],[38.5,105.5]],"info":{"capital":"Luoyang","pop":"~30 million","synopsis":"The Zhou royal house has lost real power. After the Quanrong sack of the western capital Haojing (770 BCE), the court relocated east to Luoyang. The Zhou king is now a ceremonial figurehead while a hundred competing feudal states fight for advantage in the Spring and Autumn period (770-476 BCE). This crucible of warfare and diplomacy will produce Confucius (b.551 BCE), Sun Tzu, and the Hundred Schools of Thought.","links":["https://en.wikipedia.org/wiki/Eastern_Zhou","https://en.wikipedia.org/wiki/Spring_and_Autumn_period"]}},{"name":"Etruscan Civilization","c":{"f":"#C09870","s":"#704830"},"coords":[[44.5,9.5],[44,11.5],[43,12.5],[42,12.5],[41.5,11.5],[42,10],[43,9.5],[44,9]],"info":{"capital":"Tarquinia, Veii, Cerveteri, Volterra (city league)","pop":"~1 million","synopsis":"The Etruscan civilization is consolidating in central Italy (modern Tuscany, Umbria, Lazio). A league of independent cities, the Etruscans are wealthy from iron and copper mining, Mediterranean trade, and skilled metalwork. They build massive tomb complexes with vivid frescoes. Etruscan kings rule early Rome until the Roman expulsion of Tarquin the Proud in 509 BCE.","links":["https://en.wikipedia.org/wiki/Etruscan_civilization"]}},{"name":"Olmec (La Venta phase)","c":{"f":"#A87858","s":"#583828"},"coords":[[18.5,-95.5],[18.5,-93.5],[18,-92],[17.5,-91],[16.5,-91.5],[16,-93],[16,-94.5],[17,-95.5],[18,-95.8]],"info":{"capital":"La Venta","pop":"~200,000","synopsis":"After the decline of San Lorenzo (c.900 BCE), Olmec power has shifted east to La Venta in modern Tabasco. The first true Mesoamerican pyramid (a 30-meter clay mound) rises here; jade and serpentine offerings are buried in elaborate caches. La Venta will flourish until c.400 BCE, by which time Olmec influence has spread across Mesoamerica. (Source: Snow 2018, pp.52-53)","links":["https://en.wikipedia.org/wiki/La_Venta","https://en.wikipedia.org/wiki/Olmecs"]}},{"name":"Chavín de Huántar Culture","c":{"f":"#9C9C84","s":"#4C4C38"},"coords":[[-7.5,-78],[-8.5,-77],[-9.5,-76],[-10.5,-75.5],[-11.5,-75.5],[-12,-76.5],[-12,-77.5],[-11,-78.5],[-9.5,-79],[-8,-79]],"info":{"capital":"Chavín de Huántar","pop":"~unknown","synopsis":"A pan-Andean religious culture is ce )","links":["https://en.wikipedia.org/wiki/Achaemenid_Empire","https://en.wikipedia.org/wiki/Darius_the_Great"]}},{"name":"Greek City-States","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[41,19.5],[40.5,21],[40.5,24],[40,26.5],[38.5,27.5],[37.5,27],[36,28],[35.5,26.5],[34.9,25.5],[35,24],[36,22.5],[37,22],[37.5,21.5],[38.5,20],[40,19.5]],"info":{"capital":"Athens, Sparta, Corinth, Thebes (independent poleis)","pop":"~3-4 million (homeland)","synopsis":"The Greek city-states (poleis) are entering their classical age. Athens, fresh from establishing democracy under Cleisthenes (508 BCE), is about to defeat Persian invasions at Marathon (490 BCE) and Salamis (480 BCE). Sparta dominates the Peloponnese with its militarized society. Beyond the homeland, Greek colonies stretch from Massilia (Marseille) and Naples in the west to the Black Sea coast in the east. (Source: Snow 2018, pp.56-59)","links":["https://en.wikipedia.org/wiki/Classical_Greece","https://en.wikipedia.org/wiki/Greco-Persian_Wars"]}},{"name":"Carthage","c":{"f":"#8060A0","s":"#402070"},"coords":[[37.4,8],[37.4,12],[36.5,12],[35.5,11.5],[34.5,11],[33.5,10],[33,8],[33.5,6],[35,5.5],[36.5,6.5],[37,7.5]],"info":{"capital":"Carthage (modern Tunis)","pop":"~3 million (with colonies)","synopsis":"Founded by Tyrian Phoenicians in 814 BCE, Carthage has become the great Punic power of the western Mediterranean. Its merchant fleets dominate trade with Iberia (silver, tin), Sicily, Sardinia, and the Atlantic coast of Africa. Carthaginian general Hanno will reportedly sail past West Africa in this century. Conflicts with Greek colonists in Sicily are escalating; the Punic Wars with Rome are still 250 years away.","links":["https://en.wikipedia.org/wiki/Ancient_Carthage"]}},{"name":"Etruscan League","c":{"f":"#C09870","s":"#704830"},"coords":[[44.5,9.5],[44,11.5],[43,12.5],[42,12.5],[41.5,11.5],[42,10],[43,9.5],[44,9]],"info":{"capital":"Twelve cities (Veii, Tarquinia, Cerveteri, Volterra, Vulci, Caere)","pop":"~1.5 million","synopsis":"The Etruscan civilization is at its political peak. Etruscan dominance over central Italy extends north to the Po valley and south to Campania. The Etruscan kings have just been expelled from Rome (Tarquin the Proud, 509 BCE), founding the Roman Republic. Etruscan religion, divination practices (haruspicy), the toga, and the Roman alphabet (via the Etruscan adaptation of Greek) all enter Roman culture from this source.","links":["https://en.wikipedia.org/wiki/Etruscan_civilization"]}},{"name":"Roman Republic (early)","c":{"f":"#D4A0A0","s":"#9A4A4A"},"coords":[[42.5,11.5],[42.2,12.5],[41.7,13],[41.4,12.7],[41.4,12.2],[41.7,11.7],[42.2,11.5]],"info":{"capital":"Rome","pop":"~150,000","synopsis":"Rome has just expelled the last Etruscan king, Tarquin the Proud, and established the Republic (509 BCE). Power is held by two annually elected consuls and a Senate. The city itself is small, dominating only Latium and a few neighboring tribes. Rome's expansion across Italy will take the next 250 years; Mediterranean dominance is centuries away.","links":["https://en.wikipedia.org/wiki/Roman_Republic"]}},{"name":"Eastern Zhou (late Spring and Autumn)","c":{"f":"#D4B870","s":"#947830"},"coords":[[40,107],[39.5,112],[38,116.5],[36,118.5],[33.5,119.5],[31,120],[28.5,118.5],[26.5,115],[25.5,111.5],[26,108],[27.5,105],[30,103],[33,103.5],[36,104.5],[38.5,105.5]],"info":{"capital":"Luoyang (nominal Zhou court)","pop":"~30 million","synopsis":"China is in the late Spring and Autumn period. The Zhou king is a powerless figurehead at Luoyang while major states (Qi, Jin, Chu, Qin, Wu, Yue) consolidate by absorbing smaller polities. Confucius (551-479 BCE) is teaching ethics, ritual, and statecraft; Laozi is associated with this era. Iron tools and large-scale irrigation are transforming agriculture. The even more violent Warring States period begins in 475 BCE.","links":["https://en.wikipedia.org/wiki/Spring_and_Autumn_period","https://en.wikipedia.org/wiki/Confucius"]}},{"name":"Mahajanapadas (Magadha rising)","c":{"f":"#D89060","s":"#985020"},"coords":[[31,73],[30,77],[29,80.5],[28,84],[26.5,87],[25,88.5],[23,87],[21,85],[19.5,83],[19,80],[20,77],[22,75],[24.5,73.5],[27,72.5],[29.5,72.5]],"info":{"capital":"Rajagriha (Magadha)","pop":"~25 million","synopsis":"Northern India is divided into 16 great realms (Mahajanapadas) named in early Buddhist and Jain texts. Magadha, on the lower Ganges, is rising to dominance under the Haryanka dynasty and will absorb its rivals. The Buddha (c.563-483 BCE) is teaching in the Ganges plain; Mahavira, founder of Jainism, is roughly contemporary. The Vedic religion is being transformed into the Upanishadic and shramana traditions. (Source: Snow 2018, pp.70-71)","links":["https://en.wikipedia.org/wiki/Mahajanapadas","https://en.wikipedia.org/wiki/Magadha"]}},{"name":"Zapotec (Monte Albán founding)","c":{"f":"#B0A060","s":"#605830"},"coords":[[17.5,-97.5],[17.5,-95.5],[16.5,-94.5],[15.5,-95],[15.5,-96.5],[16,-97.5],[17,-97.7]],"info":{"capital":"Monte Albán","pop":"~150,000","synopsis":"In the Valley of Oaxaca, the Zapotec have just founded Monte Albán on a leveled mountaintop (c.500 BCE). It will grow to dominate the region for the next thousand years. The Zapotec are developing the first true writing system in the Americas (the Zapotec script), with calendrical inscriptions. Olmec influence has shaped their iconography but Zapotec society is its own. (Source: Snow 2018, pp.52-53)","links":["https://en.wikipedia.org/wiki/Monte_Alb%C3%A1n","https://en.wikipedia.org/wiki/Zapotec_civilization"]}},{"name":"Chavín de Huántar Culture","c":{"f":"#9C9C84","s":"#4C4C38"},"coords":[[-7.5,-78],[-8.5,-77],[-9.5,-76],[-10.5,-75.5],[-12,-76],[-12.5,-77],[-12,-78],[-10.5,-78.5],[-9,-79],[-7.5,-78.5]],"info":{"capital":"Chavín de Huántar","pop":"~unknown","synopsis":"The Chavín religious culture is at its zenith across the central Andes. Pilgrims travel to the Chavín de Huántar temple from coast and highland alike. Distinctive Chavín iconography appears in textiles, ceramics, and metalwork from northern Peru to the southern coast. Chavín architecture introduces sunken courts, U-shaped temple plans, and complex labyrinthine interiors that will influence Andean ceremonialism for the next 2,000 years.","links":["https://en.wikipedia.org/wiki/Chav%C3%ADn_culture"]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{" "https://en.wikipedia.org/wiki/Warring_States_period"]}},{"name":"Roman Republic (mid-Republic)","c":{"f":"#D4A0A0","s":"#9A4A4A"},"coords":[[44,10],[44,12.5],[43.5,13.5],[42.5,14.5],[41.5,14.5],[40.5,14.5],[40,13.5],[40.5,12],[41.5,11],[42.5,10],[43.5,9.5]],"info":{"capital":"Rome","pop":"~1 million","synopsis":"Rome has just emerged from the Samnite Wars (343-290 BCE in progress) and is steadily extending its hegemony across central Italy. The Latin League has been dissolved (338 BCE) and Latium fully Romanized. Rome is still small by ancient standards: nothing like a Mediterranean power yet. The Punic Wars with Carthage are still 60 years away.","links":["https://en.wikipedia.org/wiki/Roman_Republic","https://en.wikipedia.org/wiki/Samnite_Wars"]}},{"name":"Carthage","c":{"f":"#8060A0","s":"#402070"},"coords":[[37.4,8],[37.4,12],[36.5,12],[35.5,11.5],[34.5,11],[33.5,10],[33,8],[33.5,6],[35,5.5],[36.5,6.5],[37,7.5]],"info":{"capital":"Carthage","pop":"~3 million","synopsis":"Carthage dominates the western Mediterranean through naval power and Punic trade networks. Wars with Greek Sicily (especially Syracuse) have been ongoing for over a century. Carthage controls coastal North Africa, much of southern Spain, Sardinia, the Balearics, and western Sicily. The First Punic War with Rome is still six decades away.","links":["https://en.wikipedia.org/wiki/Ancient_Carthage"]}},{"name":"Zapotec at Monte Albán","c":{"f":"#B0A060","s":"#605830"},"coords":[[17.5,-97.5],[17.5,-95.5],[16.5,-94.5],[15.5,-95],[15.5,-96.5],[16,-97.5],[17,-97.7]],"info":{"capital":"Monte Albán","pop":"~250,000","synopsis":"Monte Albán has grown into the political and religious capital of the Valley of Oaxaca. The Zapotec are using a hieroglyphic script for calendrical and dynastic inscriptions, the earliest true writing system in the Americas. Monumental stone \"danzante\" carvings of slain enemies adorn the central plaza. (Source: Snow 2018, pp.52-53, 78-79)","links":["https://en.wikipedia.org/wiki/Monte_Alb%C3%A1n"]}},{"name":"Chavín de Huántar Culture (late)","c":{"f":"#9C9C84","s":"#4C4C38"},"coords":[[-7.5,-78],[-8.5,-77],[-9.5,-76],[-10.5,-75.5],[-11.5,-76],[-11.5,-77],[-10.5,-78],[-9,-78.5],[-7.5,-78.5]],"info":{"capital":"Chavín de Huántar","pop":"~unknown","synopsis":"The Chavín religious sphere is in its final phase. The temple complex at Chavín de Huántar is being abandoned around 200 BCE; regional cultures (Paracas on the south coast, Salinar on the north) are emerging as the religious network frays. Many Chavín artistic motifs (the staff god, feline imagery) will continue to influence later Andean civilizations.","links":["https://en.wikipedia.org/wiki/Chav%C3%ADn_culture"]}},{"name":"Mauryan India (founding)","c":{"f":"#D4B060","s":"#946830"},"coords":[[33,72],[33,86],[22,86],[20,75],[26,72]],"info":{"capital":"Pataliputra","pop":"20-30 million","synopsis":"Chandragupta Maurya was preparing to overthrow the Nandas (he'd succeed by c.321 BCE) and would found the Mauryan Empire that would unify most of the Indian subcontinent for the first time. His grandson Ashoka would convert to Buddhism after the Kalinga War.","links":[]}},{"name":"Bosporan Kingdom","c":{"f":"#9C84B0","s":"#5C4080"},"coords":[[47,32],[47,42],[42,42],[42,32]],"info":{"capital":"Panticapaeum","pop":"0.2-0.4 million","synopsis":"The Greek-Scythian Bosporan Kingdom controlled the Cimmerian Bosporus (modern Strait of Kerch) and exported grain from the Pontic steppe to the Greek poleis of the Mediterranean. A multicultural hybrid state of Greek colonists, Scythians, Sarmatians, and Maeotians.","links":[]}},{"name":"Cyrenaica (Magas era)","c":{"f":"#A0B870","s":"#608030"},"coords":[[34,18],[34,26],[28,26],[28,18]],"info":{"capital":"Cyrene","pop":"0.3-0.5 million","synopsis":"The Greek colonial cities of Cyrenaica (modern eastern Libya) — Cyrene, Apollonia, Barca — would fall under Ptolemaic control after Alexander's death, governed initially by Ptolemy I's stepson Magas. Famous for breeding fine horses and exporting silphium, an herb so valuable it was harvested to extinction.","links":[]}},{"name":"Inuit / Arctic peoples","c":{"f":"#A8B8C8","s":"#3A4858"},"coords":[[83,-40],[83,-15],[78,-15],[72,-40],[68,-60],[68,-110],[70,-140],[71,-170],[66,-180],[66,170],[68,160],[72,140],[71,100],[78,80],[83,50],[83,-40]],"peoples":true,"info":{"region":"Arctic — Greenland, Canadian Arctic, Alaska, Chukotka","lifeway":"Hunter-gatherers (sea mammal hunters: seal, whale, walrus)","languages":"Inuit (Inuktitut, Kalaallisut, Inupiaq); Yupik; earlier Paleo-Eskimo","synopsis":"Inuit and their Paleo-Eskimo predecessors have continuously occupied the Arctic since at least 4000 BCE. Their kayak, harpoon, and igloo technology made habitation possible where no state ever could project sustained authority. The Thule Inuit expansion across the North American Arctic occurred c.1000-1500 CE, displacing the earlier Dorset culture.","links":[]}},{"name":"San / Bushmen","c":{"f":"#C8B098","s":"#6A5238"},"coords":[[-15,15],[-15,28],[-26,28],[-31,22],[-26,15],[-20,12],[-15,15]],"peoples":true,"info":{"region":"Southern Africa — Kalahari Desert and surrounding regions","lifeway":"Hunter-gatherers (small antelope, plants, tubers)","languages":"Khoisan family (with distinctive click consonants); Ju|'hoan, !Kung","synopsis":"The San are among the oldest continuously identifiable peoples on Earth. Genetic evidence places their lineage at the deepest branches of the human family tree (>70,000 years). They were progressively pushed into the Kalahari by Bantu agriculturalist expansion from c.500 BCE onward, then by European settlement after 1652. Their click-consonant languages preserve features of very early human speech.","links":[]}},{"name":"Aboriginal Australians","c":{"f":"#D4A878","s":"#7A4818"},"coords":[[-10,113],[-10,144],[-19,146],[-29,153],[-39,148],[-39,141],[-34,135],[-31,131],[-31,121],[-25,114],[-21,113],[-10,113]],"peoples":true,"info":{"region":"Australia + Tasmania (Lutruwita)","lifeway":"Hunter-gatherers (fire-stick farming, fish traps, seasonal harvests)","languages":"~250 distinct Aboriginal language families (Pama-Nyungan + many others) prior to British arrival","synopsis":"Aboriginal Australians have continuously occupied the continent for at least 50,000-65,000 years — possibly the longest continuous cultural tradition on Earth. Hundreds of distinct nations, each with their own country (a religiously and economically defined territory) and law. British colonization beginning in 1788 brought catastrophic disruption; nevertheless, Aboriginal cultural and linguistic continuity endures.","links":[]}},{"name":"Eurasian steppe nomads (pre-Mongol)","c":{"f":"#A8A8A8","s":"#404040"},"coords":[[52,30],[55,80],[52,115],[44,110],[40,80],[44,42],[48,32],[52,30]],"peoples":true,"info":{"region":"Eurasian steppe — Pannonia to Mongolia","lifeway":"Pastoral nomads (horses, sheep); mounted archers","languages":"Various Turkic, Mongolic, Indo-Iranian (Scythian, Sarmatian, Sogdian) languages","synopsis":"The Eurasian steppe was home to a succession of nomadic confederations — Scythians, Xiongnu, Huns, Avars, Göktürks, Uyghurs, Khazars, and many more — none of which fit the conventional definition of states but all of which projected periodic devastating power against sedentary empires from Han China to Rome to Sassanid Persia. The Mongols of 1206 were the culmination of this two-millennia tradition.","links":[]}},{"name":"Amazonian peoples","c":{"f":"#7AB088","s":"#2A6038"},"coords":[[5,-72],[5,-50],[-2,-46],[-12,-52],[-15,-65],[-12,-75],[-3,-78],[3,-75],[5,-72]],"peoples":true,"info":{"region":"Amazon basin — modern Brazil, Peru, Colombia, Venezuela, Bolivia, Ecuador, Guyanas","lifeway":"Forest horticulturalists + foragers + river fishers","languages":"Hundreds of distinct languages across many families (Arawakan, Carib, Tupian, Pano-Tacanan, etc.)","synopsis":"The Amazon basin was home to vastly more people in pre-Columbian times than once believed — archaeological evidence reveals extensive earthworks, raised fields, dark-earth agriculture, and possibly settlements of hundreds of thousands. European-introduced disease devastated Amazonian populations after 1500; many surviving peoples maintain political and cultural autonomy in the deep forest to this day.","links":[]}},{"name":"Sami (Sapmi)","c":{"f":"#A8B8D0","s":"#384858"},"coords":[[71,18],[71,30],[68,31],[64,21],[64,12],[68,15],[71,18]],"peoples":true,"info":{"region":"Sapmi — northern Norway, Sweden, Finland, Russian Kola Peninsula","lifeway":"Reindeer herders + fishers + hunter-gatherers","languages":"Sami language family (Uralic), with multiple distinct Sami languages","synopsis":"The Sami are the indigenous Finno-Ugric people of northern Fennoscandia, organized historically into siida communities under chiefs. They practiced (and many still practice) reindeer pastoralism, joiking (a distinctive vocal tradition), and shamanism (suppressed by Lutheran missionaries from the 1600s). Sami parliaments exist today in Norway, Sweden, and Finland with limited authority over Sami affairs.","links":[]}},{"name":"Bedouin","c":{"f":"#D8B098","s":"#6A4818"},"coords":[[32,34],[32,55],[14,52],[14,42],[20,38],[28,34],[32,34]],"peoples":true,"info":{"region":"Arabian Peninsula + Levantine and Saharan margins","lifeway":"Pastoral nomads (camels, sheep, goats); tribal confederations","languages":"Arabic (Bedouin dialects preserve features of Classical Arabic)","synopsis":"The Bedouin are the desert-pastoralist Arabs whose tribal genealogies, oral poetry, code of hospitality, and Arabic dialects supplied the cultural raw material of Islam in the 7th century. Tribes ranged from small kin groups to large confederations (Banu Hilal, Anaza, Shammar) that periodically founded states or shifted the political balance of the Arab world.","links":[]}},{"name":"Andean / pre-state highland peoples","c":{"f":"#B89070","s":"#604018"},"coords":[[10,-78],[5,-74],[-10,-75],[-22,-65],[-22,-72],[-13,-78],[-3,-80],[5,-78],[10,-78]],"peoples":true,"info":{"region":"Andean cordillera and Pacific coast — modern Peru, Bolivia, Ecuador","lifeway":"Vertical-ecology farmers (potato, maize, quinoa); llama/alpaca pastoralists","languages":"Proto-Quechua; Aymara; Mochica; many others","synopsis":"Long before the Inca synthesis, the Andes were home to many highland and coastal polities and peoples — Chavín, Paracas, Wari, Tiwanaku, Moche, Nazca, and countless smaller groups. Most were not states in any centralized sense but managed sophisticated vertical-ecology systems (controlling agricultural zones from coast to highlands).","links":[]}}],"-1600":[{"name":"Egypt (Second Intermediate / native Theban kings)","c":{"f":"#D4A060","s":"#947030"},"coords":[[24,30.5],[24,33.5],[31,33.5],[31,30.5]],"info":{"capital":"Thebes (native rule in the south)","pop":"1.5-2 million","synopsis":"Native Egyptian kings of the 16th/17th Dynasty ruled Upper Egypt from Thebes while Lower Egypt was held by the Hyksos Asiatic dynasty. Kamose and Ahmose I would expel the Hyksos around 1550 BCE and found the New Kingdom (Source: Snow 2018, pp.34-43).","links":[]}},{"name":"Hyksos dynasty","c":{"f":"#D8B098","s":"#7A5C42"},"coords":[[27,30],[32,30],[32,34.5],[28,34],[27,30]],"info":{"capital":"Avaris (in eastern Nile delta)","pop":"0.8-1.5 million","synopsis":"Asiatic rulers (probably Canaanite/Amorite) had seized the eastern Nile delta around 1650 BCE, introducing the composite bow, the horse-drawn chariot, and bronze weapons to Egypt. Their rule lasted about a century before native Theban kings drove them out (Source: Snow 2018, pp.34-43).","links":[]}},{"name":"Old Babylonian (Hammurabi's heirs)","c":{"f":"#B08858","s":"#705030"},"coords":[[37,38],[37,48],[30,48],[30,38]],"info":{"capital":"Babylon","pop":"1-2 million","synopsis":"Hammurabi had died around 1750 BCE; his successor Samsu-iluna faced revolts and lost the southern provinces. The dynasty would limp on until the Hittite raid of Babylon around 1595 BCE ended it. Babylonian astronomy, mathematics, and the Code of Hammurabi defined the era.","links":[]}},{"name":"Hittite Old Kingdom (Hattusili I)","c":{"f":"#C09060","s":"#806030"},"coords":[[42,32],[42,40],[37,42],[37,32]],"info":{"capital":"Hattusa","pop":"0.8-1.2 million","synopsis":"Hattusili I (c.1650-1620 BCE) founded the Hittite Old Kingdom and campaigned into Syria. His successor Mursili I would sack Babylon around 1595 BCE before being assassinated. The Hittites were the first major Indo-European empire in Anatolia (Source: Snow 2018, pp.38-43).","links":[]}},{"name":"Mitanni (early)","c":{"f":"#C09060","s":"#806030"},"coords":[[37,36],[39,42],[34,44],[34,36]],"info":{"capital":"Washukanni","pop":"0.5-1 million","synopsis":"The Hurrian-led Mitanni confederation was forming around 1600 BCE in upper Mesopotamia. By the 15th century it would be a major power challenging Egypt for the Levant before being crushed by the Hittites.","links":[]}},{"name":"Indus Valley (terminal phase)","c":{"f":"#7CB87C","s":"#3A7A3A"},"coords":[[32,67],[32,75],[22,75],[22,67]],"info":{"capital":"Harappa / Mohenjo-daro (declining)","pop":"2-4 million","synopsis":"Mature Harappan civilization was in its terminal phase by 1600 BCE — urban centers were being abandoned, the script was disappearing, trade with Mesopotamia had collapsed. Causes debated: climate shift, river-course changes, possible Aryan migration.","links":[]}},{"name":"Mycenaean Greece (shaft-grave era)","c":{"f":"#82A8C8","s":"#4A6890"},"coords":[[40,20],[40,24],[36.5,24],[36.5,20]],"info":{"capital":"Mycenae","pop":"0.3-0.5 million","synopsis":"The Mycenaean civilization was in its early stage around 1600 BCE — the rich Grave Circle A shaft burials at Mycenae yield gold death masks, weapons, and signs of Minoan influence. The palatial period would peak two centuries later.","links":[]}},{"name":"Minoan Crete (New Palaces)","c":{"f":"#C890A0","s":"#8A4060"},"coords":[[36,23],[3 const SNAPSHOT_KEYS=Object.keys(SNAPSHOTS).sort((a,b)=>parseInt(a)-parseInt(b));
function formatYear(y){if(y<0)return Math.abs(y)+' BCE';if(y===0)return '1 BCE';return y+' CE'}
function yearToSlider(y){return y+3000}
function sliderToYear(v){return v-3000}
function findSnap(year){let b=SNAPSHOT_KEYS[0],m=Infinity;for(const k of SNAPSHOT_KEYS){const d=Math.abs(year-parseInt(k));if(d<m){m=d;b=k}}return b}

let map,layers=[],markers=[],currentYear=-3000,isPlaying=false,playInt=null;
// Two basemap variants of the same CartoDB Voyager style. The labeled one is the default
// (place names are baked into the raster tiles). In quiz mode we swap to the nolabels variant
// so country names aren't rendered onto the map.
let tileLabeled=null, tileNolabels=null;

/* v1.21: collapsible control groups (legend + overlay toggles). On phones both
 * start collapsed so the map isn't buried under chrome. */
function toggleCollapse(id){const el=document.getElementById(id);if(el)el.classList.toggle('collapsed');}
function isSmallScreen(){try{return (window.innerWidth||1200)<=768;}catch(e){return false;}}

/* v1.18: overlay visibility toggles (top-right control group) */
const OVERLAYS = { peoples: true, routes: true, capitals: true, disputed: true };
function toggleOverlay(kind){
  OVERLAYS[kind] = !OVERLAYS[kind];
  const btn = document.getElementById('ovt-' + kind);
  if(btn) btn.classList.toggle('on', OVERLAYS[kind]);
  // Re-render the current snapshot so the overlay enters/leaves the map
  if(typeof setYear === 'function' && typeof currentYear === 'number') setYear(currentYear);
}

function initMap(){
  map=L.map('map',{center:[25,30],zoom:3,minZoom:2,maxZoom:7,zoomControl:true,attributionControl:true,worldCopyJump:true});
  const tileAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
  tileLabeled  = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,opacity:1, attribution: tileAttr});
  tileNolabels = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,opacity:1, attribution: tileAttr});
  tileLabeled.addTo(map);
  map.on('zoomend',()=>document.body.classList.toggle('show-cap-names',map.getZoom()>=5));
  if(isSmallScreen()){
    const lg=document.getElementById('legend'); if(lg)lg.classList.add('collapsed');
    const ov=document.getElementById('overlay-toggles'); if(ov)ov.classList.add('collapsed');
  }
  loadYear(-3000);
  setTimeout(()=>document.getElementById('loading').classList.add('hidden'),600);
}
function setBasemapForQuiz(quizOn){
  if(!map || !tileLabeled || !tileNolabels)return;
  if(quizOn){
    if(map.hasLayer(tileLabeled))map.removeLayer(tileLabeled);
    if(!map.hasLayer(tileNolabels))tileNolabels.addTo(map);
  } else {
    if(map.hasLayer(tileNolabels))map.removeLayer(tileNolabels);
    if(!map.hasLayer(tileLabeled))tileLabeled.addTo(map);
  }
  // Keep the basemap behind everything else (Leaflet automatically does this for tile layers,
  // but a fresh addTo can sometimes briefly stack above; force the pane order):
  if(tileLabeled.getContainer && tileLabeled.getContainer())tileLabeled.getContainer().style.zIndex='200';
  if(tileNolabels.getContainer && tileNolabels.getContainer())tileNolabels.getContainer().style.zIndex='200';
}

function clearAll(){layers.forEach(l=>map.removeLayer(l));layers=[];markers.forEach(m=>map.removeLayer(m));markers=[]}

function loadYear(year){
  currentYear=year;clearAll();
  const sk=findSnap(year),data=SNAPSHOTS[sk];
  if(!data)return;
  if(data[0]&&data[0].modern){loadModernCountries(year);return;}
  const leg=[];
  const inQuiz = (typeof QUIZ!=='undefined') && QUIZ.mode;
  data.forEach(emp=>{
    // v1.18: skip peoples entries when the peoples overlay is toggled off
    if(emp.peoples && typeof OVERLAYS!=='undefined' && !OVERLAYS.peoples) return;
    // v1.7.1: status keyed by snapshot key (sk), not raw year, so slider position doesn't matter.
    const statusKey = sk+'__'+emp.name;
    const st = inQuiz ? (QUIZ.status[statusKey]) : null;
    let fc=emp.c.f, sc=emp.c.s, fop=0.5, w=2.5;
    if(st==='correct'){fc='#1F5530'; sc='#0E3A1A'; fop=0.78; w=1.8;}
    else if(st==='wrong'){fc='#7A1A1A'; sc='#4A0A0A'; fop=0.78; w=1.8;}
    // v1.16: peoples entries get markedly different visual treatment — SVG hatched fill +
    // heavy dashed stroke, no quiz dispatch, no name label.
    const isPeoples = !!emp.peoples;
    // v1.8: render the empire polygon in 3 world copies (lng offsets) for seamless wrap.
    // Capture the primary (dx===0) polygon so we can place the label at its centroid.
    let primaryPoly = null;
    for(const dx of [-360, 0, 360]){
      const coords = (dx===0) ? emp.coords : wrappedLatLngs(emp.coords, dx);
      let polyOpts;
      if(isPeoples){
        // Stateless peoples: dashed thick stroke + low-opacity solid placeholder fill;
        // the actual fill is overridden to the hatch SVG pattern post-render below.
        polyOpts = {fillColor: emp.c.f, fillOpacity: 0.18, color: emp.c.s, weight: 2.5,
                    dashArray: '8,5', lineCap: 'round'};
      } else {
        polyOpts = {fillColor:fc, fillOpacity:fop, color:sc, weight:w};
      }
      const poly=L.polygon(coords, polyOpts).addTo(map);
      poly._empName = emp.name;
      poly._empData = emp;
      poly._empColor = {f:emp.c.f, s:emp.c.s};
      poly._wrapDx = dx;
      poly._isPeoples = isPeoples;
      if(isPeoples){
        // Apply SVG hatch pattern to the rendered path element (after Leaflet inserts it).
        setTimeout(()=>{ const el = poly.getElement && poly.getElement(); if(el) el.setAttribute('fill','url(#peoples-hatch)'); }, 0);
        poly.on('click',()=>openPeoplesPanel(emp, sk));
        poly.on('mouseover',function(){this.setStyle({fillOpacity:0.30, weight:3.5});});
        poly.on('mouseout', function(){this.setStyle({fillOpacity:0.18, weight:2.5}); const el=this.getElement&&this.getElement(); if(el)el.setAttribute('fill','url(#peoples-hatch)');});
      } else {
        poly.on('click',()=>{
          if(typeof QUIZ!=='undefined' && QUIZ.mode){startQuizForEmpire(emp,sk);return;}
          openPanel(emp,sk);
        });
        poly.on('mouseover',function(){
          const isActive=(typeof QUIZ!=='undefined')&&QUIZ.active&&QUIZ.active.name===emp.name && (QUIZ.active.year==sk);
          this.setStyle({fillOpacity:isActive?0.9:0.7,weight:isActive?3.5:3.5});
        });
        poly.on('mouseout',function(){
          const stNow = (typeof QUIZ!=='undefined') && QUIZ.mode ? QUIZ.status[sk+'__'+emp.name] : null;
          const isActive=(typeof QUIZ!=='undefined')&&QUIZ.active&&QUIZ.active.name===emp.name && (QUIZ.active.year==sk);
          let fc2=emp.c.f, sc2=emp.c.s, fop2=0.5, w2=2.5;
          if(stNow==='correct'){fc2='#1F5530'; sc2='#0E3A1A'; fop2=0.78; w2=1.8;}
          else if(stNow==='wrong'){fc2='#7A1A1A'; sc2='#4A0A0A'; fop2=0.78; w2=1.8;}
          if(isActive){fop2=0.9; sc2='#8A4040'; w2=3.0;}
          this.setStyle({fillColor:fc2,fillOpacity:fop2,color:sc2,weight:w2});
        });
      }
      layers.push(poly);
      if(dx===0) primaryPoly = poly;
    }
    // Skip the empire name label in quiz mode (would give away question 1).
    // Peoples entries never get a divIcon label either — they're not quizzable and the hatched
    // territory speaks for itself; clicking opens the peoples panel.
    if(!inQuiz && !isPeoples && primaryPoly){
      const ctr=primaryPoly.getBounds().getCenter();
      const lbl=L.marker(ctr,{icon:L.divIcon({className:'',html:'<div style="font-family:DM Sans,sans-serif;font-size:11px;font-weight:600;color:'+emp.c.s+';text-shadow:1px 1px 3px rgba(255,255,255,0.95),-1px -1px 3px rgba(255,255,255,0.95),0 0 8px rgba(255,255,255,0.8);white-space:nowrap;text-transform:uppercase;letter-spacing:1.5px;pointer-events:none">'+emp.name+'</div>',iconSize:[0,0],iconAnchor:[0,0]}),interactive:false}).addTo(map);
      layers.push(lbl);
    }
    leg.push({n:emp.name,f:emp.c.f,s:emp.c.s});
  });
  const evts=KEY_EVENTS[sk];
  if(evts)evts.forEach(ev=>{
    const m=L.circleMarker([ev.lat,ev.lng],{radius:5,fillColor:'#fff',fillOpacity:1,color:'#8A4040',weight:2}).addTo(map);
    m.bindPopup('<div class="event-popup"><div class="title">'+ev.t+'</div><div class="desc">'+ev.d+'</div></div>',{maxWidth:260});
    markers.push(m);
  });
  // v1.17: trade routes — render any route whose appears_on includes this snapshot key.
  if(typeof TRADE_ROUTES!=='undefined' && (typeof OVERLAYS==='undefined' || OVERLAYS.routes)){
    const snapInt = parseInt(sk);
    TRADE_ROUTES.forEach(rt=>{
      if(!rt.appears_on.includes(snapInt))return;
      // Render in 3 world copies for seamless wrap
      for(const dx of [-360, 0, 360]){
        const pts = rt.waypoints.map(([la,lo])=>[la, lo+dx]);
        const line = L.polyline(pts, {
          color: rt.color,
          weight: 3,
          opacity: 0.85,
          dashArray: '10,6',
          lineCap: 'round',
          lineJoin: 'round',
        }).addTo(map);
        line.on('click', ()=>openRoutePanel(rt, sk));
        line.on('mouseover', function(){this.setStyle({weight:5, opacity:1});});
        line.on('mouseout', function(){this.setStyle({weight:3, opacity:0.85});});
        layers.push(line);
        // Small filled circle at each waypoint (primary copy only)
        if(dx===0){
          rt.waypoints.forEach(([la,lo])=>{
            const dot = L.circleMarker([la,lo], {radius:3, fillColor:rt.color, fillOpacity:1, color:'#fff', weight:1}).addTo(map);
            dot.on('click', ()=>openRoutePanel(rt, sk));
            layers.push(dot);
          });
        }
      }
    });
  }
  // v1.19: capital city markers (hidden in quiz mode — they would give away the capital answers)
  if(!inQuiz && OVERLAYS.capitals){
    data.forEach(emp=>{
      if(emp.peoples)return;
      const capStr=emp.info&&emp.info.capital; if(!capStr)return;
      const key=capitalKey(capStr); if(!key)return;
      const ll=CAPITAL_COORDS[key];
      addCapitalMarker(ll[0],ll[1],capitalDisplayName(capStr),false);
    });
  }
  const el=document.getElementById('legend-items');
  let h='';
  if(inQuiz){
    h+='<div class="legend-item"><div class="legend-swatch" style="background:#1F5530;border:1px solid #0E3A1A"></div><span class="legend-label">Aced (quiz)</span></div>';
    h+='<div class="legend-item"><div class="legend-swatch" style="background:#7A1A1A;border:1px solid #4A0A0A"></div><span class="legend-label">Missed a question</span></div>';
    h+='<div class="legend-item"><span class="legend-label" style="color:var(--text3);font-size:10px">Refreshing the page wipes your scoreboard.</span></div>';
  } else {
    leg.forEach(i=>h+='<div class="legend-item"><div class="legend-swatch" style="background:'+i.f+';border:1px solid '+i.s+'"></div><span class="legend-label">'+i.n+'</span></div>');

/* ============================================================
 * v1.20: Compare mode — two synced Leaflet maps side by side.
 * Read-only rendering (no clicks/quiz); states only, peoples and
 * routes omitted for legibility. Pan/zoom is mirrored both ways.
 * ============================================================ */
const CMP={open:false,maps:[null,null],layers:[[],[]],years:[null,null],syncing:false};
function parseYearStr(s){s=String(s||'').trim().toLowerCase();const m=s.match(/(\d+)\s*(bce|bc|ce|ad)?/);if(!m)return null;let y=parseInt(m[1]);if(m[2]==='bce'||m[2]==='bc')y=-y;return Math.max(-3000,Math.min(2026,y));}
function toggleCompare(){ if(CMP.open)closeCompare(); else openCompare(); }
function openCompare(){
  CMP.open=true;
  document.getElementById('compare-btn').classList.add('active');
  document.getElementById('compare-overlay').classList.add('visible');
  const tileAttr='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
  for(const i of [0,1]){
    if(!CMP.maps[i]){
      const m=L.map('cmp-map-'+i,{center:map?map.getCenter():[25,30],zoom:map?map.getZoom():3,minZoom:2,maxZoom:7,zoomControl:i===0,attributionControl:i===1,worldCopyJump:true});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:tileAttr}).addTo(m);
      m.on('move',()=>syncCompare(i));
      CMP.maps[i]=m;
      const inp=document.getElementById('cmp-input-'+i);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const y=parseYearStr(inp.value);if(y!==null){renderCompareSide(i,y);inp.value='';}}});
    }
  }
  // Defaults: left = current snapshot, right = 1500 CE (or 2000 CE if we are already at/past 1500)
  const ly=parseInt(findSnap(currentYear));
  const ry=(ly>=2000)?1500:((ly>=1500)?2000:1500);
  setTimeout(()=>{ for(const i of [0,1]) CMP.maps[i].invalidateSize(); renderCompareSide(0,CMP.years[0]!=null?CMP.years[0]:ly); renderCompareSide(1,CMP.years[1]!=null?CMP.years[1]:ry); },60);
}
function closeCompare(){
  CMP.open=false;
  document.getElementById('compare-btn').classList.remove('active');
  document.getElementById('compare-overlay').classList.remove('visible');
}
function syncCompare(src){
  if(CMP.syncing||!CMP.open)return;
  const other=1-src; if(!CMP.maps[other])return;
  CMP.syncing=true;
  CMP.maps[other].setView(CMP.maps[src].getCenter(),CMP.maps[src].getZoom(),{animate:false});
  CMP.syncing=false;
}
function cmpStep(i,dir){
  const cur=(CMP.years[i]!=null)?findSnap(CMP.years[i]):SNAPSHOT_KEYS[0];
  let idx=SNAPSHOT_KEYS.indexOf(cur)+dir;
  idx=Math.max(0,Math.min(SNAPSHOT_KEYS.length-1,idx));
  renderCompareSide(i,parseInt(SNAPSHOT_KEYS[idx]));
}
function renderCompareSide(i,year){
  const m=CMP.maps[i]; if(!m)return;
  CMP.years[i]=year;
  CMP.layers[i].forEach(l=>m.removeLayer(l)); CMP.layers[i]=[];
  const sk=findSnap(year), data=SNAPSHOTS[sk];
  document.getElementById('cmp-label-'+i).textContent=formatYear(parseInt(sk));
  if(!data)return;
  let count=0, isModern=!!(data[0]&&data[0].modern);
  if(isModern){
    const g=L.geoJSON(buildWrappedGeo(MODERN_GEO),{
      interactive:false,
      style:f=>{const p=MODERN_PALETTE[modernHash(f.properties.name||'')%MODERN_PALETTE.length];return {fillColor:p.f,fillOpacity:0.45,color:p.s,weight:0.7};}
    }).addTo(m);
    CMP.layers[i].push(g);
    count=MODERN_GEO.features.length;
  } else {
    data.forEach(emp=>{
      if(emp.peoples)return;
      count++;
      for(const dx of [-360,0,360]){
        const coords=(dx===0)?emp.coords:wrappedLatLngs(emp.coords,dx);
        const poly=L.polygon(coords,{fillColor:emp.c.f,fillOpacity:0.5,color:emp.c.s,weight:1.8,interactive:false}).addTo(m);
        CMP.layers[i].push(poly);
        if(dx===0){
          const ctr=poly.getBounds().getCenter();
          const lbl=L.marker(ctr,{icon:L.divIcon({className:'',html:'<div style="font-family:DM Sans,sans-serif;font-size:10px;font-weight:600;color:'+emp.c.s+';text-shadow:1px 1px 3px rgba(255,255,255,0.95),-1px -1px 3px rgba(255,255,255,0.95);white-space:nowrap;text-transform:uppercase;letter-spacing:1px;pointer-events:none">'+emp.name+'</div>',iconSize:[0,0],iconAnchor:[0,0]}),interactive:false}).addTo(m);
          CMP.layers[i].push(lbl);
        }
      }
    });
  }
  document.getElementById('cmp-count-'+i).textContent=count+(isModern?' countries':' states');
}


let modernHashCache={};
function modernHash(name){
  if(name in modernHashCache)return modernHashCache[name];
  let h=0;for(const c of name)h=((h<<5)-h)+c.charCodeAt(0)|0;
  return modernHashCache[name]=Math.abs(h);
}
const MODERN_PALETTE=[
  {f:'#C8A050',s:'#8A6A20'},{f:'#82A8C8',s:'#4A6890'},{f:'#D4A0A0',s:'#9A4A4A'},
  {f:'#88B898',s:'#3A7A4A'},{f:'#92A8C0',s:'#506888'},{f:'#D4A060',s:'#947030'},
  {f:'#7CB87C',s:'#3A7A3A'},{f:'#C09060',s:'#806030'},{f:'#D4B870',s:'#947830'},
  {f:'#C890A0',s:'#8A4060'},{f:'#9C84B0',s:'#5C4080'},{f:'#B89070',s:'#705038'},
  {f:'#88A878',s:'#487048'},{f:'#A0B870',s:'#608030'},{f:'#D8B098',s:'#7A5C42'}
];
/* v1.8: helpers to render polygons in 3 wrapped world copies for a seamless globe-like map. */
function shiftCoordsLngOffset(geom, dx){
  if(!geom)return;
  if(geom.type==='Polygon'){
    geom.coordinates = geom.coordinates.map(ring => ring.map(([x,y]) => [x+dx, y]));
  } else if(geom.type==='MultiPolygon'){
    geom.coordinates = geom.coordinates.map(poly => poly.map(ring => ring.map(([x,y]) => [x+dx, y])));
  }
}
function buildWrappedGeo(geo){
  // Returns a FeatureCollection where every feature is triplicated at lng -360/0/+360.
  const out=[];
  for(const dx of [-360, 0, 360]){
    for(const f of geo.features){
      const nf = JSON.parse(JSON.stringify(f));
      shiftCoordsLngOffset(nf.geometry, dx);
      nf.properties = nf.properties || {};
      nf.properties._wrapDx = dx;
      out.push(nf);
    }
  }
  return {type:'FeatureCollection', features:out};
}
// Same idea for raw [lat,lng] polygon coords used by historical empires.
function wrappedLatLngs(coords, dx){
  return coords.map(([lat,lng]) => [lat, lng+dx]);
}

function loadModernCountries(year){
  const c=L.geoJSON(buildWrappedGeo(MODERN_GEO),{
    style:f=>{
      const name=f.properties.name||'';
      const p=MODERN_PALETTE[modernHash(name)%MODERN_PALETTE.length];
      const st=(typeof QUIZ!=='undefined')&&QUIZ.status['2000__'+name];
      if(st==='correct')return {fillColor:'#1F5530',fillOpacity:0.78,color:'#0E3A1A',weight:1.6};
      if(st==='wrong')return {fillColor:'#7A1A1A',fillOpacity:0.78,color:'#4A0A0A',weight:1.6};
      return {fillColor:p.f,fillOpacity:0.45,color:p.s,weight:0.7};
    },
    onEachFeature:(f,l)=>{
      const name=f.properties.name||'Unknown';
      // No tooltips on the modern layer — names only appear in the side panel on click.
      // (Hover gives a visual highlight via setStyle below.)
      l.on('click',()=>{
        if(typeof QUIZ!=='undefined' && QUIZ.mode){startQuiz(name);return;}
        openCountryPanel(name,year);
      });
      l.on('mouseover',function(){
        const isActive=(typeof QUIZ!=='undefined')&&QUIZ.active&&QUIZ.active.name===name;
        this.setStyle({fillOpacity:isActive?0.85:0.7,weight:isActive?2.5:1.4});
      });
      l.on('mouseout',function(){
        const st=(typeof QUIZ!=='undefined')&&QUIZ.status['2000__'+name];
        const isActive=(typeof QUIZ!=='undefined')&&QUIZ.active&&QUIZ.active.name===name;
        const p=MODERN_PALETTE[modernHash(name)%MODERN_PALETTE.length];
        let fc=p.f,sc=p.s,fop=0.45,w=0.7;
        if(st==='correct'){fc='#1F5530';sc='#0E3A1A';fop=0.78;w=1.6;}
        else if(st==='wrong'){fc='#7A1A1A';sc='#4A0A0A';fop=0.78;w=1.6;}
        if(isActive){fop=0.9;sc='#8A4040';w=2.8;}
        this.setStyle({fillColor:fc,fillOpacity:fop,color:sc,weight:w});
      });
    }
  }).addTo(map);
  if(typeof QUIZ!=='undefined')QUIZ.geoLayer=c;
  layers.push(c);
  // v1.22: disputed / breakaway territories (Natural Earth 50m) as a red-hatched layer above
  // the country fills. Clickable for info outside quiz mode; inert during quizzes so clicks
  // fall through to the countries beneath.
  if(typeof DISPUTED_GEO!=='undefined' && OVERLAYS.disputed){
    const quizNow=(typeof QUIZ!=='undefined')&&QUIZ.mode;
    const dg=L.geoJSON(buildWrappedGeo(DISPUTED_GEO),{
      interactive:!quizNow,
      style:()=>({fillColor:'#B03030',fillOpacity:0.22,color:'#8A2020',weight:1.6,dashArray:'5,4'}),
      onEachFeature:(f,l)=>{
        if(!quizNow){
          l.on('click',()=>openDisputedPanel(f.properties.name,f.properties.note));
          l.on('mouseover',function(){this.setStyle({weight:2.6,fillOpacity:0.32});});
          l.on('mouseout',function(){this.setStyle({weight:1.6,fillOpacity:0.22}); const el=this.getElement&&this.getElement(); if(el)el.setAttribute('fill','url(#disputed-hatch)');});
        }
      }
    }).addTo(map);
    dg.eachLayer(l=>setTimeout(()=>{const el=l.getElement&&l.getElement(); if(el)el.setAttribute('fill','url(#disputed-hatch)');},0));
    layers.push(dg);
  }
  // v1.8: simple painted Antarctica band so the bottom isn't white. Not quizzable.
  for(const dx of [-360, 0, 360]){
    const anta = L.polygon([
      [-60, -180+dx], [-60, 180+dx],
      [-90, 180+dx],  [-90, -180+dx]
    ],{fillColor:'#92A8C0', fillOpacity:0.55, color:'#506888', weight:0.7, interactive: dx===0}).addTo(map);
    if(dx===0){
      anta.on('click',()=>openAntarcticaPanel(year));
      anta.on('mouseover',function(){this.setStyle({fillOpacity:0.75})});
      anta.on('mouseout',function(){this.setStyle({fillOpacity:0.55})});
    }
    layers.push(anta);
  }
  // Defensive: strip every common label-bearing attribute and child element off the
  // country path elements so nothing — Leaflet, browser, screen reader, accessibility
  // extension — has a hook to surface a country name on hover. Runs immediately and at
  // staggered intervals to catch any async additions.
  scrubCountryLabels();
  setTimeout(scrubCountryLabels,100);
  setTimeout(scrubCountryLabels,500);
  setTimeout(scrubCountryLabels,1500);
  // v1.19: modern capital stars. Names appear at zoom >= 5 (body.show-cap-names) to avoid
  // clutter at world zoom. Hidden entirely in quiz mode (capital is a quiz answer).
  const quizOnNow=(typeof QUIZ!=='undefined')&&QUIZ.mode;
  if(!quizOnNow && OVERLAYS.capitals){
    for(const cname in MODERN_CAPITALS){
      const mc=MODERN_CAPITALS[cname];
      addCapitalMarker(mc.ll[0],mc.ll[1],mc.n,true);
    }
  }
  // Render KEY_EVENTS for the modern era too if any
  const sk=findSnap(year),evts=KEY_EVENTS[sk];
  if(evts)evts.forEach(ev=>{
    const m=L.circleMarker([ev.lat,ev.lng],{radius:5,fillColor:'#fff',fillOpacity:1,color:'#8A4040',weight:2}).addTo(map);
    m.bindPopup('<div class="event-popup"><div class="title">'+ev.t+'</div><div class="desc">'+ev.d+'</div></div>',{maxWidth:260});
    markers.push(m);
  });
  const el=document.getElementById('legend-items');
  const inQuiz=(typeof QUIZ!=='undefined')&&QUIZ.mode;
  let lh='<div class="legend-item"><span class="legend-label" style="font-weight:600">Modern world</span></div>';
  if(inQuiz){
    lh+='<div class="legend-item"><div class="legend-swatch" style="background:#1F5530;border:1px solid #0E3A1A"></div><span class="legend-label">Aced (quiz)</span></div>';
    lh+='<div class="legend-item"><div class="legend-swatch" style="background:#7A1A1A;border:1px solid #4A0A0A"></div><span class="legend-label">Missed a question</span></div>';
    lh+='<div class="legend-item"><span class="legend-label" style="color:var(--text3);font-size:10px">Refreshing the page wipes your scoreboard.</span></div>';
  } else {
    lh+='<div class="legend-item"><span class="legend-label">'+MODERN_GEO.features.length+' countries shown</span></div>';
    lh+='<div class="legend-item"><span class="legend-label" style="color:var(--text3);font-size:10px">Source: Natural Earth (public domain)</span></div>';
    if(OVERLAYS.capitals)lh+='<div class="legend-item"><span class="legend-swatch" style="background:transparent;border:none;color:#5A2E2E;font-size:12px;line-height:12px;text-align:center">&#9733;</span><span class="legend-label">Capital city (names at zoom 5+)</span></div>';
    if(OVERLAYS.disputed)lh+='<div class="legend-item"><div class="legend-swatch" style="background:repeating-linear-gradient(-45deg,rgba(176,48,48,0.15) 0px,rgba(176,48,48,0.15) 3px,#8A2020 3px,#8A2020 5px);border:1px solid #8A2020"></div><span class="legend-label">Disputed territory</span></div>';
  }
  lh+='<div class="legend-item"><div class="legend-swatch" style="background:#fff;border:2px solid #8A4040;border-radius:50%;width:12px;height:12px"></div><span class="legend-label">Key event</span></div>';
  el.innerHTML=lh;
}
function openAntarcticaPanel(year){
  document.getElementById('panel-title').textContent='Antarctica';
  document.getElementById('panel-subtitle').textContent=formatYear(year);
  let h='<div class="panel-section"><h3>Status</h3><p>Antarctica is governed by the Antarctic Treaty System (1959), an international agreement that designates the continent as a scientific preserve. It has no permanent government or population, no quizzable demographic data.</p></div>';
  h+='<div class="panel-section"><h3>Population</h3><p>~1,000–5,000 temporary research staff (seasonal); no permanent residents.</p></div>';
  h+='<div class="panel-section"><h3>Claims (not internationally recognized)</h3><p>Argentina, Australia, Chile, France, New Zealand, Norway, United Kingdom. The U.S. and Russia reserve the right to claim.</p></div>';
  h+='<div class="panel-section"><h3>Learn more</h3><div class="panel-links"><a href="https://en.wikipedia.org/wiki/Antarctica" target="_blank">Wikipedia article →</a></div></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}

function openCountryPanel(name,year){
  document.getElementById('panel-title').textContent=name;
  document.getElementById('panel-subtitle').textContent=formatYear(year);
  const facts=(typeof COUNTRY_FACTS!=='undefined')?COUNTRY_FACTS[name]:null;
  let h='';
  const NA = '<span style="color:var(--text3);font-style:italic">N/A</span>';
  // L1 line items always shown; missing fields render as N/A
  const cap = (facts && facts.capital && facts.capital[0]) || null;
  const cur = (facts && facts.currency && facts.currency[0]) || null;
  h+='<div class="panel-stats">';
  h+='<div class="stat-card"><div class="label">Capital</div><div class="value">'+(cap?escapeHtml(cap):NA)+'</div></div>';
  h+='<div class="stat-card"><div class="label">Currency</div><div class="value">'+(cur?escapeHtml(cur):NA)+'</div></div>';
  h+='</div>';
  // Population + % of world
  let popLine = NA;
  if(facts && facts.population_m!=null){
    popLine = formatPop(facts.population_m)+' <span style="color:var(--text3)">·</span> <span style="color:var(--text3);font-weight:600">'+formatWorldPct(facts.world_pct)+' of world</span>';
  }
  h+='<div class="panel-section"><h3>Population</h3><p>'+popLine+'</p></div>';
  // Top 3 religions
  if(facts && facts.religion_top3){
    h+='<div class="panel-section"><h3>Top 3 religions</h3><p>'+facts.religion_top3.map(r=>escapeHtml(r.name)+' <span style="color:var(--text3);font-weight:600">'+r.pct+'%</span>').join(' · ')+'</p></div>';
  } else {
    h+='<div class="panel-section"><h3>Top 3 religions</h3><p>'+NA+'</p></div>';
  }
  // Top 3 languages
  if(facts && facts.language_pct){
    h+='<div class="panel-section"><h3>Top 3 languages</h3><p>'+facts.languages.map((l,i)=>(i+1)+'. '+escapeHtml(l[0])+' <span style="color:var(--text3);font-weight:600">'+facts.language_pct[i]+'%</span>').join('<br>')+'</p></div>';
  } else {
    h+='<div class="panel-section"><h3>Top 3 languages</h3><p>'+NA+'</p></div>';
  }
  if(!facts){
    h+='<div class="panel-section"><h3>Country</h3><p>'+escapeHtml(name)+'</p></div>';
  }
  h+='<div class="panel-section"><h3>Era</h3><p>Modern world (post-1990 borders).</p></div>';
  h+='<div class="panel-section"><h3>Source</h3><p>Borders from Natural Earth 1:110m public-domain dataset. Country facts are an in-house v1.7 dataset; percentages are approximate.</p></div>';
  h+='<div class="panel-section"><h3>Learn more</h3><div class="panel-links"><a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(name.replace(/ /g,'_'))+'" target="_blank">Wikipedia article &rarr;</a></div></div>';
  document.getElementById('panel-body').innerHTML=h;
  document.getElementById('side-panel').classList.add('open');
}

/* Population display helpers */
function formatPop(m){
  if(m==null)return '—';
  if(m>=1000) return (m>=10000?Math.round(m/1000):(m/1000).toFixed(1))+'B';
  if(m>=1)    return (m>=10?Math.round(m):m.toFixed(1))+'M';
  if(m>=0.001)return Math.round(m*1000)+'k';
  if(m>=0.000001)return Math.round(m*1e6)+'';
  return m.toExponential(1);
}
function formatWorldPct(p){
  if(p==null)return '—';
  if(p>=10)   return p.toFixed(1)+'%';
  if(p>=0.01) return p.toFixed(2)+'%';
  if(p>=0.001)return p.toFixed(3)+'%';
  return '<0.001%';
}

  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

const TRADE_ROUTES=[{"name":"Silk Road (overland)","color":"#8A4040","waypoints":[[34.27,108.95],[40.45,95.0],[42.95,89.18],[42.96,75.34],[39.62,66.97],[36.71,67.1],[35.69,51.42],[33.32,44.42],[33.51,36.3],[41.01,28.97],[45.43,12.34]],"appears_on":[-323,1,100,300,500,800,1000,1200,1325,1450,1500,1600,1700],"era":"~200 BCE – 1700 CE (active core period)","goods":"Silk; jade; spices; horses; glass; gold and silver coin; ideas (Buddhism east, paper west)","controllers":"Han China east end; Parthia/Sassanid Persia middle; Tang/Sogdians/Uyghurs/Mongols at varying eras; Venice/Genoa west end","synopsis":"The Silk Road was not one road but a shifting network of overland routes connecting China to the Mediterranean. Caravan stages handed goods from polity to polity; few traders crossed the entire distance. Its golden age coincided with the Mongol Pax Mongolica (1240s-1340s), enabling Marco Polo's journey. The route declined when European maritime routes around Africa undercut it after 1500."},{"name":"Phoenician Mediterranean network","color":"#9C4080","waypoints":[[33.27,35.21],[33.55,35.38],[34.12,35.65],[35.18,33.36],[36.41,25.43],[37.97,23.72],[38.12,13.36],[36.85,10.32],[38.34,0.49],[36.14,-5.35],[38.72,-9.14]],"appears_on":[-1200,-800,-500,-323],"era":"~1200 BCE – 300 BCE","goods":"Cedar; purple murex dye; glass; silver; tin (from Britain via Cadiz); slaves; pottery","controllers":"Tyre and Sidon (independent city-states), then Carthage (after 800 BCE)","synopsis":"Phoenician traders from the Levantine coast pioneered Mediterranean long-distance commerce. They founded colonies as trading posts along the route — Carthage (814 BCE) being the largest, eventually overshadowing the home cities. They invented the alphabet that became Greek and Latin. The network ended when Rome destroyed Carthage in 146 BCE."},{"name":"Trans-Saharan gold-salt trade","color":"#C8A050","waypoints":[[31.79,7.12],[27.4,-4.5],[22.59,-2.5],[16.77,-3.0],[16.27,-0.04],[13.51,-2.11],[12.65,-7.99]]," .91,-77.04]],"appears_on":[1600,1700,1815,1860],"era":"~1500 CE – 1860s (collapse)","goods":"Europe → Africa: textiles, guns, rum, manufactured goods. Africa → Americas: ~12.5 million enslaved Africans. Americas → Europe: sugar, tobacco, cotton, rum, silver","controllers":"Portuguese, then Dutch, then British (peak), French, Spanish; ended by abolition (UK 1807, US 1808, Brazil 1888)","synopsis":"The Atlantic slave trade was the largest forced migration in human history — 12.5 million Africans shipped to the Americas between 1525 and 1866, of whom ~10.7 million survived the Middle Passage. The triangular pattern (textiles to Africa, captives to Americas, plantation goods to Europe) shaped four continents' economies and demographics. British abolition in 1807-1833, US in 1865, Brazil in 1888 ended the legal trade."},{"name":"Manila galleon route","color":"#B85048","waypoints":[[16.5,-99.91],[13.5,-110.0],[14.59,120.97],[22.4,114.18]],"appears_on":[1600,1700,1815],"era":"1565 – 1815 (250 years)","goods":"Mexico → Manila: Spanish American silver (especially from Potosí). Manila → Mexico: Chinese silk and porcelain, Indian textiles, Indonesian spices","controllers":"Spanish Empire (Acapulco end + Manila garrison)","synopsis":"For 250 years, Spanish galleons crossed the Pacific annually between Acapulco and Manila, exchanging American silver for Asian luxuries — the first regular trans-Pacific trade route. It funded the Ming and Qing economies via the silver influx and made Mexico's economy a hinge between Asian and European exchange systems. Mexican independence in 1821 ended the route."},{"name":"Amber Road","color":"#C8A040","waypoints":[[54.69,25.28],[54.35,18.65],[52.23,21.01],[50.06,19.94],[47.5,19.04],[46.05,14.51],[45.43,12.34],[41.9,12.49]],"appears_on":[-1200,-800,-500,-323,1,100,300,500],"era":"~1500 BCE – 500 CE","goods":"Baltic amber (sole northbound traffic); wine, glass, bronze, silver heading north as payment","controllers":"No single power; Etruscan, Rom
